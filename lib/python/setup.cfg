[tool:pytest]
# -n auto (pytest-xdist) parallelizes across CPU cores by default -- this is
# the ONLY thing that makes pytest run in parallel; xdist being importable
# does nothing on its own (it's a plugin, auto-discovered via setuptools
# entry points once installed, inert until -n is passed). Benchmarked
# 2026-07-21: full suite 371s serial -> 120s with -n auto, same pass/skip
# counts. Override per-invocation with -n0/-p no:xdist if a debugging session
# needs serial output.
addopts = -n auto
