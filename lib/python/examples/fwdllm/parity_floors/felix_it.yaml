# Measured same-seed replicate floor: the spread two config-identical real legs
# show with NO code change. The parity checker sizes its DIST tolerances from
# this (simulate_fwdllm.md D-24) -- a tolerance far above the floor passes real
# divergences, one below it grades noise. Regenerate with
# `replicate_floor.py --mode real --profile-out <dir>`; do not hand-edit.
jvp_eval_mode: true
max_runtime_s: 7200
measured_at: '2026-08-04'
metrics:
  accuracy_diff: 0.0785
  iter_drift_lambda: 0.0121
  iters_ma_max_dev: 6.95
  iters_ma_mean_dev: 1.1825
  iters_per_bin: 0.048
  mean_var: 0.0017
  throughput_rel: 0.059
  time_to_n: 0.058
  trainers_at_n: 0.0
n_replicates: 2
rungs:
  accuracy_diff:
    field: acc_tol
    nominal: 0.05
    rung: convergence
  iter_drift_lambda:
    field: lambda_floor_per_100
    nominal: 0.05
    rung: v1c_iter_drift_rate
  iters_ma_max_dev:
    field: ma_max_abs_tol
    nominal: 0.75
    rung: v1b_iters_moving_avg
  iters_ma_mean_dev:
    field: ma_mean_abs_tol
    nominal: 0.25
    rung: v1b_iters_moving_avg
  iters_per_bin:
    field: mean_tol_rel
    nominal: 0.15
    rung: v1_iter_per_data_id
  mean_var:
    field: mean_tol_rel
    nominal: 0.02
    rung: v2_var_trajectory
  throughput_rel:
    field: tol_rel
    nominal: 0.08
    rung: throughput
  time_to_n:
    field: time_tol
    nominal: 0.08
    rung: terminal_state
  trainers_at_n:
    field: trainers_tol
    nominal: 0.05
    rung: terminal_state
source_runs:
- '20260803_042036'
- '20260803_062254'
