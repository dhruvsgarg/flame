experiments:
- name: fwdllm_yahoo_n60_smoke_syn_0_sim
  description: 'FedFwd SIM smoke (100 trainers, c=10, fwdllm baseline: sync random+fedavg,
    time_mode=simulated). Validates the Batch-1 sim clock/ordering port.'
  baseline: fwdllm
  example:
    trainer_main: trainer/main.py
  trainer:
    num_trainers: 60
    start_id: 1
    dataset:
      name: yahoo
      path_style: true
      dirichlet_alpha: 100
    availability:
      mode: syn_0
    time_mode: simulated
    enable_training_delays: true
    client_idx_modulo: 100
    config_overrides:
      hyperparameters:
        seed: 1234
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yahoo_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yahoo_partition.h5
        partition_method: niid_label_clients=100_alpha=100
        jvp_eval_mode: true
        jvp_perf_opt: true
        sim_straggler_spread_s: 0.0
        client_notify:
          trace: syn_0
        dataset: yahoo
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: llama
        model_name: HuggingFaceTB/SmolLM2-1.7B
        peft_method: lora
        train_batch_size: 32
        adapter_reduction_factor: 16
        lora_r: 2
    hyperparameters:
      training_delay_factor: 0.047
      training_delay_floor_s: 4.0
  aggregator:
    config_template: configs/aggregator_base.json
    selector: random
    tracking_mode: default
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: fwdllm_yahoo_n60_smoke_syn_0_sim
      hyperparameters:
        seed: 1234
        rounds: 50
        inflight_residence: true
        max_data_id_progress: 9999
        max_runtime_s: 1000000000
        eval_every_n_commits: 3
        sim_charge_profile_path: /home/dgarg39/aish_test/flame/lib/python/examples/fwdllm/sim_charge_profiles/fwdllm.yaml
        sim_wall_ceiling_s: 1000000000
        sim_model_agg_compute_time: true
        sim_model_dispatch_queue: true
        sim_sct_ordered_drain: true
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yahoo_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yahoo_partition.h5
        partition_method: niid_label_clients=100_alpha=100
        dataset: yahoo
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: llama
        model_name: HuggingFaceTB/SmolLM2-1.7B
        peft_method: lora
        var_threshold: 8.4
        server_update_audit: true
        learning_rate: 0.003
        train_batch_size: 32
        cos_ground_truth_audit: false
        adapter_reduction_factor: 16
        lora_r: 2
        phi_stop_threshold: 1000000000.0
        send_timeout_wait_s: 3600.0
        eval_max_samples: 6000
        eval_resample: true
        final_full_eval: true
        max_commits: 100000
        target_stop_acc: 0.65
        target_stop_window: 2
        trackTrainerAvail:
          trace: syn_0
      selector:
        kwargs:
          c: 10
          minInitialTrainers: 60
  execution:
    num_gpus: 8
    sleep_between_spawns: 2.0
    aggregator_warmup_time: 20
    monitoring:
      enabled: false
