# Real-profiled vclock charges for sim-only costs sim can't measure
# live (FWDLLM_DESIGN.md §P). Regenerate via expt_scripts/
# profile_sim_charges.py -- hand-edit only `charge:`/`rationale:`.
drain_tail:
  _default:
    charge: true
    mean_s: 0.2783
    n: 3654
    p90_s: 0.8304
    profiled_at: '2026-07-29'
    rationale: 07-30 flipped ON. The old "sim's own span IS the cost" rationale was
      falsified -- sim runs the same op but under ~100 co-located trainer threads,
      so its live span is contention-inflated (0.585 vs real 0.330 s/cycle on
      fluxtune, 1.77x) and folding it onto the vclock injects sim-host noise into
      the clock (simulate_fwdllm.md §D-18, §F-1/§F-20). Charged from real instead.
    source_runs:
    - run_20260729_034223_fedbuff_round_n100_smoke_syn_0_real
    - run_20260729_055151_felix_round_n100_smoke_syn_0_real
fedavg:
  _default:
    charge: true
    mean_s: 0.0645
    n: 3654
    p90_s: 0.1997
    profiled_at: '2026-07-29'
    rationale: 07-30 flipped ON, same reason as drain_tail -- sim 0.078 vs real 0.059
      s/cycle. Smaller term but the same contention-injection defect.
    source_runs:
    - run_20260729_034223_fedbuff_round_n100_smoke_syn_0_real
    - run_20260729_055151_felix_round_n100_smoke_syn_0_real
redispatch_turnaround:
  var_bad:
    charge: false
    mean_s: 0.0036
    n: 27209
    p90_s: 0.0077
    profiled_at: '2026-07-29'
    rationale: marginal per-trainer cost ~0.004s, negligible next to "weights"'
      ~0.06s -- left off.
    source_runs:
    - run_20260729_034223_fedbuff_round_n100_smoke_syn_0_real
    - run_20260729_055151_felix_round_n100_smoke_syn_0_real
  weights:
    charge: true
    mean_s: 0.0598
    n: 9310
    p90_s: 0.0503
    profiled_at: '2026-07-29'
    rationale: real MQTT/dispatch-thread turnaround sim doesn't do. 07-29 -- was
      0.488s (flat pool of cumulative per-batch readings, 7.3-8.3x overcharge);
      now the first-difference marginal per-trainer cost within each redispatch
      batch (simulate_fwdllm.md §B, §D).
    source_runs:
    - run_20260729_034223_fedbuff_round_n100_smoke_syn_0_real
    - run_20260729_055151_felix_round_n100_smoke_syn_0_real
