experiments:
- name: rblr_E_lora6_lr3e-3_v0.3
  description: RoBERTa-L Yelp-P fwdllm lr test on the rb60 config (n100, c=10, r6, var 0.3), lr 0.003.
  baseline: fwdllm
  example:
    trainer_main: trainer/main.py
  trainer:
    num_trainers: 100
    start_id: 1
    dataset:
      name: yelp-p
      path_style: true
      dirichlet_alpha: 1
    availability:
      mode: syn_0
    time_mode: simulated
    enable_training_delays: true
    client_idx_modulo: 100
    config_overrides:
      hyperparameters:
        seed: 1234
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yelp-p_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yelp-p_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        jvp_eval_mode: true
        jvp_perf_opt: true
        sim_straggler_spread_s: 0.0
        client_notify:
          trace: syn_0
        dataset: yelp-p
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: roberta-large
        model_name: roberta-large
        peft_method: lora
        train_batch_size: 32
        lora_r: 6
    hyperparameters:
      training_delay_factor: 0.169
      training_delay_floor_s: 4.0
  aggregator:
    config_template: configs/aggregator_base.json
    selector: random
    tracking_mode: default
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: rblr_E_lora6_lr3e-3_v0.3
      hyperparameters:
        seed: 1234
        rounds: 50
        inflight_residence: true
        max_data_id_progress: 9999
        max_runtime_s: 1000000000
        eval_every_n_commits: 4
        sim_charge_profile_path: /home/dgarg39/aish_test/flame/lib/python/examples/fwdllm/sim_charge_profiles/fwdllm.yaml
        sim_wall_ceiling_s: 432000.0
        sim_model_agg_compute_time: true
        sim_model_dispatch_queue: true
        sim_sct_ordered_drain: true
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yelp-p_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yelp-p_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        dataset: yelp-p
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: roberta-large
        model_name: roberta-large
        peft_method: lora
        var_threshold: 0.3
        learning_rate: 0.003
        train_batch_size: 32
        cos_ground_truth_audit: false
        lora_r: 6
        phi_stop_threshold: 1000000000.0
        send_timeout_wait_s: 3600.0
        eval_max_samples: 3800
        eval_resample: true
        target_stop_acc: 0.83
        target_stop_window: 2
        trackTrainerAvail:
          trace: syn_0
        server_update_audit: true
        final_full_eval: true
      selector:
        kwargs:
          c: 10
          minInitialTrainers: 100
  execution:
    num_gpus: 2
    sleep_between_spawns: 2.0
    aggregator_warmup_time: 20
    monitoring:
      enabled: false
