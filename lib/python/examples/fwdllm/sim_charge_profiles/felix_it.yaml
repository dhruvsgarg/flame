# Real-profiled vclock charges for sim-only costs sim can't measure
# live (FWDLLM_DESIGN.md §P). Regenerate via expt_scripts/
# profile_sim_charges.py -- hand-edit only `charge:`/`rationale:`.
drain_tail:
  _default:
    charge: true
    mean_s: 0.3726
    n: 549
    p90_s: 1.0289
    profiled_at: '2026-08-01'
    rationale: sim runs the same op under ~100 co-located trainer threads, so its
      live span is contention-inflated and folding it on the vclock injects sim-host
      noise (simulate_fwdllm.md D-18, F-1/F-20). Charged from this baseline's real.
    source_runs:
    - run_20260731_195405_felix_it_n100_smoke_syn_0_real
fedavg:
  _default:
    charge: true
    mean_s: 0.0888
    n: 549
    p90_s: 0.2511
    profiled_at: '2026-08-01'
    rationale: same as drain_tail -- sim's own span is contention-inflated, so the
      charge comes from this baseline's real.
    source_runs:
    - run_20260731_195405_felix_it_n100_smoke_syn_0_real
redispatch_turnaround:
  var_bad:
    charge: true
    mean_s: 0.117
    n: 2759
    p90_s: 0.3315
    profiled_at: '2026-08-01'
    rationale: ON. Real's per-trainer marginal dispatch turnaround for a VAR=bad resend,
      which sim does not perform. Negligible on the round baselines (~0.003s, <1%
      of the vclock) but 0.12-0.32s elsewhere, where leaving it off omits a real cost
      (simulate_fwdllm.md D-36). Operator decision 08-01; MAGNITUDE UNVALIDATED on
      fluxtune/felix_it/fedbuff_it_* -- it would add 20-62% to those vclocks, so the
      sim-leg A/B in section B must confirm it before any long batch.
    source_runs:
    - run_20260731_195405_felix_it_n100_smoke_syn_0_real
  weights:
    charge: true
    mean_s: 0.0973
    n: 2669
    p90_s: 0.2627
    profiled_at: '2026-08-01'
    rationale: real MQTT/dispatch-thread turnaround sim does not do. First-difference
      marginal per-trainer cost within each redispatch batch, never a flat pool of
      the cumulative per-batch readings (simulate_fwdllm.md D-12).
    source_runs:
    - run_20260731_195405_felix_it_n100_smoke_syn_0_real
