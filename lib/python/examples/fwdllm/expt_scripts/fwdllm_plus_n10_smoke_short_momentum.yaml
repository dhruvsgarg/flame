# MOMENTUM sibling of fwdllm_plus_n10_smoke_short.yaml -- IDENTICAL except
# `hyperparameters.server_momentum: 0.9`. Same rationale as
# fwdllm_n10_smoke_short_momentum.yaml (S1's scope across baselines is
# undecided, see simulate_fwdllm.md §A).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_plus_n10_smoke_short_momentum.yaml

experiments:
  - name: fwdllm_plus_n10_smoke_short_momentum
    description: "FedFwd SHORT smoke (10 trainers, fwdllm_plus baseline, 8min budget), server_momentum=0.9."

    baseline: fwdllm_plus

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        path_style: true
      availability:
        mode: syn_0
      time_mode: real
      enable_training_delays: false
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_plus_n10_smoke_short_momentum
        hyperparameters:
          server_momentum: 0.9
          rounds: 50
          inflight_residence: true
          max_data_id_progress: 9999
          max_runtime_s: 480  # 8min (SHORT variant)
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
