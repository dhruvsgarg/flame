# FedFwd SIMULATED-clock smoke test: 100 trainers, agnews H5 partitions
# (client_idx 0-99, the full 100-partition niid_label_clients=100_alpha=1
# population). Sim sibling of fwdllm_n100_smoke.yaml -- IDENTICAL except
# time_mode: simulated and the job id (so run dirs don't collide). c=10 of
# the 100-trainer pool selected/round (agg_goal==c==10).
#
# time_mode: simulated exercises the Batch-1 sim path: the trainer skips the
# real emulated-delay sleep and stamps a modeled sim_completion_ts; the
# aggregator orders commits by that sct on a virtual clock (sync barrier here,
# via _sync_sim_recv_first_k). Trainers still do real forward-grad compute, so
# gradient VALUES are mode-invariant -- only the clock/ordering differ.
#
# enable_training_delays stays false (as in the real smoke) so this variant is
# DIRECTLY comparable to fwdllm_n100_smoke.yaml: with D=0 the sct = dispatch +
# real GPU time, which still drives the reorder buffer + vclock advance and
# validates the mechanics. Modeled-delay-on (D>0, the full sim behavior) is for
# the later convergence/parity runs, enabled in BOTH the real reference and the
# sim run together (see simulate_fwdllm.md §K-D8).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_n100_smoke_sim.yaml

experiments:
  - name: fwdllm_n100_smoke_sim
    description: "FedFwd SIM smoke (100 trainers, c=10, fwdllm baseline: sync random+fedavg, time_mode=simulated). Validates the Batch-1 sim clock/ordering port."

    baseline: fwdllm

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
        # Cosmetic-only for path-style (naming/snapshot), but kept in sync
        # with the actual partition_method below (EXPTS_CHARTER A5: alpha=1).
        dirichlet_alpha: 1
      availability:
        mode: syn_0
      # Batch 1: drive the simulated virtual clock instead of real sleeps.
      time_mode: simulated
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- 1:1 onto all 100 H5 partitions
      # (also the full §O trainer_registry.yaml speed-class population).
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          # Selector RNG seed — inert on the trainer (self-selects); logged for
          # cross-role consistency with the aggregator (§F-18). Not the pert seed.
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5, decided value for all experiments).
          # MUST match the real pair or parity sees a data-skew divergence
          # with no clock cause.
          partition_method: niid_label_clients=100_alpha=1
          # Phase 4c (B2, #6): widen the sim barrier's k-th-smallest sct to
          # match real's per-trainer completion dispersion (banked real compute
          # std ~0.26s; uniform[0,spread) offset ⇒ spread ≈ 0.26·√12). Only
          # active with --delays on (convergence run); inert at D=0. Calibrate
          # to wall_disparity→~0 at the sign-off run.
          sim_straggler_spread_s: 0.0   # P2-3/K-D29: per-trainer registry delays now supply the completion spread (remainder-wait max(gpu,D)); the crc32 offset would re-noise the deterministic order
          client_notify:
            trace: syn_0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: default
      # Matches selector.kwargs.c below -- every selected trainer is required.
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_n100_smoke_sim
        hyperparameters:
          seed: 1234  # deterministic selector RNG + model init; MUST match fwdllm_n100_smoke.yaml
          rounds: 50  # short smoke run, not the full 300
          # Hold a returned trainer's re-pick guard to commit, not RETURN
          # (§R, 2026-07-11). No-op here (agg_goal == c, full-cohort barrier)
          # but keeps the invariant/config identical across all baselines.
          inflight_residence: true
          # Smoke-test stop bar: whichever of these fires first ends the run
          # (`rounds` alone is much too coarse, since one round is 150
          # data-id completions).
          max_data_id_progress: 9999  # effectively unbounded; runs governed by max_runtime_s (pass --max-data-id for a short run)
          max_runtime_s: 3600  # ...or after 60 minutes sim vclock
          # Outer wall failsafe (code default 20x max_runtime_s is too loose).
          sim_wall_ceiling_s: 7200
          # Phase 4c (B1, #6, REMOVED §6 Part 6): sim_model_eval_time used to
          # charge the MEASURED server eval_s (~13s/data_id -- the syn_0 wall
          # dominator) onto the vclock -- removed once eval_model() was
          # backgrounded (no longer a synchronous critical-path cost in either
          # mode to fold). See simulate_fwdllm.md §G.
          # #15: also charge the measured aggregate()-call wall (every cycle,
          # not just committed ones) -- was the dominant uncredited real-wall
          # driver of sim_rate<1, not a trainer-side compute floor.
          sim_model_agg_compute_time: true
          # Sim-only transport/ordering models, validated on fluxtune; enabled here
          # to confirm inert-or-better on the sync baselines before making default.
          sim_model_dispatch_queue: true   # MQTT serial-send stagger (#6)
          sim_sct_ordered_drain: true      # drain buffered grads in sct order (#13)
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5); must match the real pair — see trainer side.
          partition_method: niid_label_clients=100_alpha=1
        selector:
          kwargs:
            # RandomSelector has no `k` concept (matches oort/async_oort/fedbuff/
            # async_random) -- `_cleanup_recvd_ends` used to cap cleanup at a
            # stale n~150-scale `k=5` batch size, which permanently orphaned
            # trainers from this agg_goal==c==10 selected pool every round
            # and, combined with the §M reselect-gate cache, caused a
            # livelock (simulate_fwdllm.md §A). Fixed: cleanup now drains all.
            # c=10 selected/round. minInitialTrainers=N=100, not c (07-17,
            # simulate_fwdllm.md §G): c<N raced sim's faster cycle cadence
            # vs real's for post-barrier joiners, diverging cohort_sequence.
            c: 10
            minInitialTrainers: 100

    execution:
      # 8, not 1 -- this yaml's own default is 100 trainers now; cramming
      # 100 trainer processes onto 1 GPU OOMs almost immediately (see
      # fluxtune_n10_smoke.yaml's execution.num_gpus comment).
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
