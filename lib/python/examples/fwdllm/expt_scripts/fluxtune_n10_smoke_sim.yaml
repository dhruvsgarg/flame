# FedFwd SIMULATED-clock smoke test: 100 trainers, agnews H5 partitions
# (client_idx 0-99, the full 100-partition niid_label_clients=100_alpha=1
# population). Sim sibling of fluxtune_n10_smoke.yaml -- IDENTICAL except
# time_mode: simulated and the job id (so run dirs don't collide). c=30
# concurrency pool out of the 100-trainer population (agg_goal=3).
#
# fluxtune is the ASYNC baseline (async_oort selector, fedbuff), so this
# variant exercises the Batch-1 async grad-loop sim drive: _sim_recv_min_grad
# (sct-ordered reorder buffer + in-flight gate + virtual-clock advance) with
# agg-goal-boundary slot release. Trainers still do real forward-grad compute
# (gradient VALUES mode-invariant); only the clock/ordering differ.
#
# enable_training_delays stays false (as in the real smoke) for direct
# comparability; modeled-delay-on (D>0) is for later parity runs, enabled in
# BOTH real reference and sim run together (see simulate_fwdllm.md §K-D8).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fluxtune_n10_smoke_sim.yaml

experiments:
  - name: fluxtune_n10_smoke_sim
    description: "FedFwd SIM smoke (100 trainers, c=30, fluxtune baseline: async async_oort+fedbuff+JVP+3-tier, time_mode=simulated). Validates the Batch-1 async grad-loop sim drive."

    baseline: fluxtune

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
      availability:
        # Phase 1 is syn_0 (100% availability): client_notify then reports all
        # trainers available. Switch to mobiperf_3st_50 (via --avail-trace) only
        # for the Phase-2 unavailability runs. run_sequential.sh's --avail-trace
        # patches trainer mode + client_notify + trackTrainerAvail together.
        mode: syn_0
      # Batch 1: drive the simulated virtual clock instead of real sleeps.
      time_mode: simulated
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- 1:1 onto all 100 H5 partitions
      # (also the full §O trainer_registry.yaml speed-class population).
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          # Fluxtune JVP perf optimizations (simulate_fwdllm.md §L) — BIT-IDENTICAL
          # grads; MUST match the real yaml (both sides read this config, so the
          # optimization keeps real<->sim parity). Set false to revert.
          jvp_perf_opt: true
          # Selector RNG seed — inert on the trainer (self-selects); logged for
          # cross-role consistency with the aggregator (§F-18). Not the pert seed.
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # Uniform/IID partition for smoke tests -- avoids the niid_label
          # baseline default's data-skew confound while validating mechanics.
          partition_method: uniform
          # Phase 4c (B2, #6): sim barrier straggler spread to match real's
          # per-trainer completion dispersion (uniform[0,spread), spread ≈
          # real-compute-std·√12). Active with --delays on; calibrate to
          # wall_disparity→~0 at the sign-off run.
          sim_straggler_spread_s: 0.0   # P2-3/K-D29: per-trainer registry delays now supply the completion spread (remainder-wait max(gpu,D)); the crc32 offset would re-noise the deterministic order

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 3
      log_to_wandb: false
      config_overrides:
        job:
          id: fluxtune_n10_smoke_sim
        hyperparameters:
          seed: 1234  # deterministic selector RNG + model init; MUST match fluxtune_n10_smoke.yaml
          rounds: 50  # short smoke run, not the full 300
          # With c=30 >> agg_goal=3, commit-then-carry the surplus grads +
          # hold busy trainers across the boundary (K-D12). Applies to real
          # too (§R, 2026-07-11) -- must match the real yaml.
          inflight_residence: true
          # 90s default evicted a genuinely-busy trainer (rounds incl.
          # warmup up to ~108s). Workload knob, not a parity lever; must
          # match real yaml (§R, 2026-07-11).
          send_timeout_wait_s: 300
          # #13 step 3: drain each in-flight end's rxq DIRECTLY (channel.drain_ready)
          # instead of the recv_fifo streamer. The streamer blocks the full recv
          # grace PER not-ready end (the 4-10s inter-burst gaps that dominated the
          # post-step-2 wall) and can strand a delivered grad out of the buffer's
          # view (past-dated commit). drain_ready sweeps ready rxqs non-blocking and
          # returns on the first arrival. SIM-only (real never enters _sim_recv_min_grad).
          sim_sct_ordered_drain: true
          # #13 step 4: freed-slot staggered re-dispatch. INVESTIGATED + DISABLED
          # (K-D28d, run_..._034550): neutral-to-slightly-worse for fwdllm (sim_rate
          # 0.289->0.274, the 11-12s holds persisted). The holds are the drain
          # correctly waiting (strict sct order) for the earliest-sct in-flight
          # straggler, NOT a dispatch-bunching artifact; staggering feeds an OLD
          # freed-slot vclock as send_ts, making the gate expect trainers even
          # earlier -> more holds. Code kept (flag-gated) for a possible reworked
          # attempt; see §H. Leave OFF -> validated steps 1-3 drain.
          sim_staggered_redispatch: false
          # #15: compute-truthful commit gate. The earlier_stuck gate blocks real
          # wall on `_sim_inflight_expected` entries stamped at DISPATCH; a trainer
          # whose payload was sent long ago but hasn't returned is idle-in-recv
          # (not computing) behind the single-threaded drain, so waiting for it
          # burns the grace floor / 30s failsafe and throttles commits -> via
          # hold-to-commit, starves re-dispatch (sim concurrency 1.65 vs real 7.69).
          # When on, the gate only blocks on a trainer still within its modeled
          # compute window (sim_gate_compute_cap_s). Hold-to-commit UNTOUCHED; this
          # only unblocks the commit path so held trainers are freed promptly.
          # SIM-only; must not move cohort/var/staleness parity (PARITY_LOGICAL_TASKS.md #15).
          sim_compute_truthful_gate: true
          sim_gate_compute_cap_s: 16.0  # derived, not guessed: fluxtune real compute p99=6.2s max=10.6s (07-15 banked run) x 1.5 safety -- FWDLLM_DESIGN.md §O
          # Async fedbuff: accept stale carried grads + down-weight by (V'-V),
          # not reject (K-D13). Set identically in the real sibling; never a
          # parity lever. camelCase MUST match the base key to override it —
          # snake_case is a dead key that loses at pydantic resolution (K-D15).
          stalenessPolicy: fedbuff
          # Smoke-test stop bar: whichever of these fires first ends the run
          # (`rounds` alone is much too coarse, since one round is 150
          # data-id completions).
          max_data_id_progress: 9999  # effectively unbounded; runs governed by max_runtime_s (pass --max-data-id for a short run)
          max_runtime_s: 1800  # ...or after 30 minutes wall time
          # Phase 4c (B1, #6, REMOVED §6 Part 6): sim_model_eval_time used to
          # charge the measured server eval_s onto the vclock -- removed once
          # eval_model() was backgrounded (no longer a synchronous critical-path
          # cost in either mode to fold). See simulate_fwdllm.md §G.
          # #15: also charge the measured aggregate()-call wall (every cycle,
          # not just committed ones) -- was the dominant uncredited real-wall
          # driver of sim_rate<1, not a trainer-side compute floor.
          sim_model_agg_compute_time: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            # c=30 concurrency pool out of the 100-trainer population (§O:
            # fluxtune's JVP cost/commit is ~4x fwdllm/plus's, so a larger
            # pool keeps enough in-flight surplus for the c-agg_goal=27
            # rotating cohort, §F#17). minInitialTrainers matches c (only c
            # trainers need join before selection starts). aggGoal is set
            # once via the top-level `agg_goal: 3` above -- the runner fans
            # it into both this kwarg and hyperparameters.aggGoal so they
            # can't drift apart; don't duplicate it here.
            c: 30
            minInitialTrainers: 30

    execution:
      # 8, not 1 -- this yaml's own default is 100 trainers now; cramming
      # 100 trainer processes onto 1 GPU OOMs almost immediately (see
      # fluxtune_n10_smoke run 20260629_221116).
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
