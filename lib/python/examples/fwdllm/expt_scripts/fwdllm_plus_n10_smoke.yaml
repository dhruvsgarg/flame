# FedFwd smoke test: 10 trainers, agnews H5 partitions (client_idx 0-9 of the
# 100 available niid_label_clients=100_alpha=1 partitions), real time_mode
# (FedFwd has no simulated-clock support yet -- see
# MIGRATION_TO_LAUNCHER_FWDLLM.md "New aspects" #6).
#
# Uses the `fwdllm_plus` baseline (sync, random selector, fedavg, ORACULAR
# availability read from _metadata, per-iteration reselection) -- exercises
# Phase 7 steps P3 (oracular-from-_metadata) and P4 (reselect_each_iteration:
# true). Sibling of fwdllm_n10_smoke.yaml/fluxtune_n10_smoke.yaml; run all
# three for full real/sim parity coverage across the taxonomy.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_plus_n10_smoke.yaml

experiments:
  - name: fwdllm_plus_n10_smoke
    description: "FedFwd smoke (10 trainers, fwdllm_plus baseline: sync random+fedavg+ORACULAR). Validates the launcher port before a full-scale run."

    baseline: fwdllm_plus

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
      availability:
        # ORACULAR reads trainer 1-10's mobiperf_2st trace from _metadata
        # (Phase 7 step P3) -- mode here just keeps the trainer-side
        # avl_events_* fields consistent with what the aggregator reads.
        mode: mobiperf_2st
      # FedFwd has no simulated-clock support; always real.
      time_mode: real
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- wraps 10 trainers onto a
      # distinct, non-colliding subset (0-9) of the 100 H5 partitions.
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # Uniform/IID partition for smoke tests -- avoids the niid_label
          # baseline default's data-skew confound while validating mechanics.
          partition_method: uniform

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: oracular
      agg_goal: 2
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_plus_n10_smoke
        hyperparameters:
          rounds: 50  # short smoke run, not the full 300
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            # Scaled down from the baseline's n=150-ish defaults (k=5, c=15)
            # to fit 10 trainers.
            k: 5
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 1
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
