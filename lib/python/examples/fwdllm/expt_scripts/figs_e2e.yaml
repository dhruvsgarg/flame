# [A] end-to-end + [B] mechanism figures (EXPERIMENTS.md §4 A/B, §7).
# One cell per model/dataset row; each arm lists one run dir per seed (resolved from
# examples/fwdllm/). Empty lists are skipped. Render:
#   python make_paper_figs.py --manifest figs_e2e.yaml [--synthetic]
kind: e2e
prefix: e2e
baseline: fwdllm
champion: fluxtune
tta_consecutive: 2          # evals in a row >= target that define "reached" (EXPERIMENTS.md §9, 10-22)
figures: [row, grid, b1, b2, b3]

cells:
  - id: distilbert_agnews
    label: "DistilBERT · AG News"
    n_clients: 100
    target_acc: 0.86        # paper target (EXPERIMENTS.md §9, 10-17)
    arms:
      fwdllm: []
      fluxtune: []
  - id: roberta_large_yelp
    label: "RoBERTa-L · Yelp-P"
    n_clients: 100
    target_acc: 0.82        # paper target
    arms:
      fwdllm: []
      fluxtune: []
  - id: smollm2_1p7b_yahoo
    label: "SmolLM2-1.7B · Yahoo"
    n_clients: 75           # 60 if 75 OOMs (RUN_PLAN §2)
    target_acc: 0.65        # paper target (FwdLLM paper's Yahoo target)
    arms:
      fwdllm: []
      fluxtune: []
