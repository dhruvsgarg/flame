# [A] end-to-end + [B] mechanism figures (EXPERIMENTS.md §4 A/B, §7).
# One cell per model/dataset row; each arm lists one run dir per seed (resolved from
# examples/fwdllm/). Empty lists are skipped. Render:
#   python make_paper_figs.py --manifest figs_e2e.yaml [--synthetic]
kind: e2e
prefix: e2e
baseline: fwdllm
champion: fluxtune
tta_consecutive: 1          # evals in a row >= target that define "reached"
figures: [row, grid, b1, b2, b3]

