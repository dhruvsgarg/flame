# FedFwd SIMULATED-clock smoke test: 100 trainers, agnews H5 partitions
# (client_idx 0-99, the full 100-partition niid_label_clients=100_alpha=1
# population). c=30 concurrency pool, agg_goal=10 (matches baselines.yaml
# felix_round's smoke-scale defaults). Sim-only per BRIDGE_DESIGN.md
# decision #3.
#
# Uses the `felix_round` baseline: Felix(P), the other published anchor
# (this project's own Felix, async_oort oort-smart selection, ported onto
# the forward-mode substrate) -- FeLiX staleness x utility rate (NOT
# fluxtune's grad_aware C3), client_notify availability (NOT oracular), no
# C1/C3. Round-level (reselect_each_iteration=false).
#
# TODO(verify): smoke-pending (BRIDGE_DESIGN.md §2b per-baseline checklist).
# Sim-fidelity knobs profiled for fluxtune (sim_gate_compute_cap_s,
# sim_completion_leg_s) are deliberately NOT copied here -- felix_round has
# no C1 (no JVP-guided perturbation scoring), so its per-iteration compute
# cost differs from fluxtune's; needs its own profiling pass. Placeholder
# `learning_rate: 0.075` (baselines.yaml) also needs retuning here.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/felix_round_n10_smoke_sim.yaml

experiments:
  - name: felix_round_n10_smoke_sim
    description: "FedFwd SIM smoke (100 trainers, c=30/agg_goal=10, felix_round baseline: async async_oort+fedbuff FeLiX rate+client_notify, no C1/C3, round-level, time_mode=simulated)."

    baseline: felix_round

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # Cosmetic-only for path-style (naming/snapshot), but kept in sync
        # with the actual partition_method below (EXPTS_CHARTER A5: alpha=1).
        dirichlet_alpha: 1
        path_style: true
      availability:
        # Phase 1 is syn_0 (100% availability): client_notify then reports all
        # trainers available. Switch to mobiperf_3st_50 (via --avail-trace) only
        # for the Phase-2 unavailability runs, matching fluxtune's own smoke.
        mode: syn_0
      time_mode: simulated
      enable_training_delays: false
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5, decided value for all experiments).
          partition_method: niid_label_clients=100_alpha=1
          sim_straggler_spread_s: 0.0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: felix_round_n10_smoke_sim
        hyperparameters:
          seed: 1234
          rounds: 50
          inflight_residence: true
          send_timeout_wait_s: 300
          sim_sct_ordered_drain: true
          sim_staggered_redispatch: false
          sim_model_dispatch_queue: true
          sim_model_agg_compute_time: true
          max_data_id_progress: 9999
          max_runtime_s: 3600  # ...or after 60 minutes sim vclock
          # Outer wall failsafe (code default 20x max_runtime_s is too loose).
          sim_wall_ceiling_s: 7200
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5, decided value for all experiments).
          partition_method: niid_label_clients=100_alpha=1
        selector:
          kwargs:
            c: 30
            minInitialTrainers: 100

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
