# 4h (14400s), N=100/C=30/K=10 sibling of fluxtune_n10_smoke.yaml -- scaled up
# from the 10-trainer smoke scale to the EXPTS_CHARTER.md "Four planned full
# runs" concurrency scale (N=100, C=30, agg_goal/K=10) plus max_runtime_s and
# the job id. S1 momentum A/B leg (fluxtune_contributions.md §8.2,
# simulate_fwdllm.md §A): the 8min/30min n10 pairs only reached windows short
# of a full 150-data_id lap; even the 7200s (2h) n10 parity scoreboard run
# never completed one lap for fluxtune (§A: "fluxtune was unaffected -- it
# never completes a lap at this scale"). N=100/C=30 is 3x the concurrency of
# the n10 pairs, so this should commit substantially faster per wall-second,
# making the round/lap boundary reachable in 4h -- showing which leg's loss
# spikes vs stays steady there. Pair with fluxtune_n100_smoke_4h_momentum.yaml
# (momentum=0.9). NOTE: partition_method is left at `uniform` (unchanged from
# the n10 smoke convention, not EXPTS_CHARTER's niid_label_clients=100_alpha=1)
# -- only N/C/K were asked to scale; switching partition method changes the
# heterogeneity story (fluxtune_contributions.md F12) and should be a
# separate, deliberate decision.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fluxtune_n100_smoke_4h.yaml

experiments:
  - name: fluxtune_n100_smoke_4h
    description: "FedFwd smoke (100 trainers, fluxtune baseline: async async_oort+fedbuff+JVP+3-tier, C=30/K=10, 4h budget). S1 momentum A/B, without-momentum leg."

    baseline: fluxtune

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
      availability:
        # Phase 1 is syn_0 (100% availability): client_notify then reports all
        # trainers available. Switch to mobiperf_3st_50 (via --avail-trace) only
        # for the Phase-2 unavailability runs. run_sequential.sh's --avail-trace
        # patches trainer mode + client_notify + trackTrainerAvail together.
        mode: syn_0
      # FedFwd has no simulated-clock support; always real.
      time_mode: real
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- at N=100 this covers all 100 H5
      # partitions exactly once (no wrap-around, unlike the n10 smoke scale).
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          # Fluxtune JVP perf optimizations (simulate_fwdllm.md §L) — all
          # BIT-IDENTICAL to the grads (scripts/profile_jvp_opt.py). Cuts
          # fluxtune's per-batch forward passes ~37% (25->20) + trainable-only
          # FD, so GPU drops under the modeled mobile delay. Set true on BOTH
          # real+sim (must match). Set false to revert to the un-optimized path.
          jvp_perf_opt: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # Uniform/IID partition for smoke tests -- avoids the niid_label
          # baseline default's data-skew confound while validating mechanics.
          partition_method: uniform

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fluxtune_n100_smoke_4h
        hyperparameters:
          seed: 1234  # deterministic selector RNG + model init (same seed both A/B legs, see fluxtune_n100_smoke_4h_momentum.yaml)
          rounds: 50  # short smoke run, not the full 300
          # Hold a busy trainer's re-pick guard to commit, not RETURN (§R,
          # 2026-07-11 -- real used to release early). Must match sim yaml.
          inflight_residence: true
          # 90s default evicted a genuinely-busy trainer (rounds incl.
          # warmup up to ~108s). Workload knob, not a parity lever; must
          # match sim yaml (§R, 2026-07-11).
          send_timeout_wait_s: 300
          # Async fedbuff: accept stale grads + down-weight by (V'-V), not reject
          # (K-D13). Set identically real+sim; never a parity lever. camelCase
          # MUST match the base key to override it — snake_case is a dead key
          # that loses at pydantic resolution (K-D15).
          stalenessPolicy: fedbuff
          # Smoke-test stop bar: whichever of these fires first ends the run
          # (`rounds` alone is much too coarse, since one round is 150
          # data-id completions).
          max_data_id_progress: 9999  # effectively unbounded; runs governed by max_runtime_s (pass --max-data-id for a short run)
          max_runtime_s: 14400  # ...or after 4 hours wall time (4h S1 A/B variant)
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            # N=100/C=30/K=10 -- the EXPTS_CHARTER.md "Four planned full runs"
            # concurrency scale (up from the n10 smoke scale's c=10/aggGoal=3).
            # aggGoal is set once via the top-level `agg_goal: 10` above -- the
            # runner fans it into both this kwarg and hyperparameters.aggGoal
            # so they can't drift apart; don't duplicate it here.
            # minInitialTrainers=N=100, not c=30 (07-17, simulate_fwdllm.md
            # §G): c<N let post-barrier joiners race sim's faster cycle
            # cadence vs real's, diverging cohort_sequence from cycle 1.
            c: 30
            minInitialTrainers: 100

    execution:
      # 8 GPUs for 100 trainer processes -- cramming 100 trainers onto 1 GPU
      # OOMs almost immediately (see fluxtune_n10_smoke run 20260629_221116).
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
