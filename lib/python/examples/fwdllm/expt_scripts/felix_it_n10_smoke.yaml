# FedFwd smoke test. Real sibling of felix_it_n10_smoke_sim.yaml -- identical
# stack, but reselect_each_iteration=true (per BASELINES.md, felix_it's own
# catalog entry). Same real/sim delta as felix_round_n10_smoke.yaml
# (time_mode, job id, dropped sim-only knobs).
#
# Uses the `felix_it` baseline: Felix(P)+IT -- grafts FluxTune's own
# iteration-level reselect cadence onto Felix(P)'s selector, isolating L1's
# contribution alone (motivating C1+C3). Never headlined.
#
# TODO(verify): smoke-pending, see felix_round_n10_smoke.yaml's notes on
# sim-fidelity knobs and the learning_rate placeholder.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/felix_it_n10_smoke.yaml

experiments:
  - name: felix_it_n10_smoke
    description: "FedFwd smoke (100 trainers, c=30/agg_goal=10, felix_it baseline: async async_oort+fedbuff FeLiX rate+client_notify, no C1/C3, per-iteration reselect)."

    baseline: felix_it

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # Cosmetic-only for path-style (naming/snapshot), but kept in sync
        # with the actual partition_method below (EXPTS_CHARTER A5: alpha=1).
        dirichlet_alpha: 1
        path_style: true
      availability:
        mode: syn_0
      time_mode: real
      enable_training_delays: false
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5, decided value for all experiments).
          partition_method: niid_label_clients=100_alpha=1

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: felix_it_n10_smoke
        hyperparameters:
          seed: 1234
          rounds: 50
          inflight_residence: true
          real_drain_ready_ingest: true
          real_distribute_settle_s: 0.0
          send_timeout_wait_s: 300
          max_data_id_progress: 9999
          max_runtime_s: 1800
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: niid_label_clients=100_alpha=1
        selector:
          kwargs:
            c: 30
            minInitialTrainers: 100

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
