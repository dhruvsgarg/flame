# SHORT variant of fwdllm_n10_smoke.yaml -- max_runtime_s 480 (8min) instead
# of 1800, for quick iteration. Pairs with fwdllm_n10_smoke_short_momentum.yaml
# (server_momentum=0.9) for a with/without A/B on the sync/fedavg baseline.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_n10_smoke_short.yaml

experiments:
  - name: fwdllm_n10_smoke_short
    description: "FedFwd SHORT smoke (10 trainers, fwdllm baseline: sync random+fedavg, 8min budget)."

    baseline: fwdllm

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        path_style: true
      availability:
        mode: syn_0
      time_mode: real
      enable_training_delays: false
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
          client_notify:
            trace: syn_0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: default
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_n10_smoke_short
        hyperparameters:
          rounds: 50
          inflight_residence: true
          max_data_id_progress: 9999
          max_runtime_s: 480  # 8min (SHORT variant)
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
