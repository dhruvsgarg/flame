# [C1-C3] ablation figures (EXPERIMENTS.md §4 C1-C3). DistilBERT · AG News, sim, >= 3 seeds.
# Arm ids match EXPERIMENTS.md tables; `sync: true` = hollow markers. A0/A6 reuse the
# figs_e2e distilbert_agnews runs.
#   python make_paper_figs.py --manifest figs_ablation.yaml [--synthetic]
kind: ablation
baseline: fwdllm
champion: fluxtune
tta_consecutive: 2
cell:
  id: distilbert_agnews
  label: "DistilBERT · AG News"
  n_clients: 100
  target_acc: 0.86          # paper target (EXPERIMENTS.md §9, 10-17)

groups:
  - id: phase_a                       # C1: FwdLLM + one concept
    title: "FwdLLM + one FluxTune concept"
    arms:
      - {key: fwdllm,       label: "FwdLLM (A0)",        sync: true, runs: []}
      - {key: a1_probe_mean, label: "+ mean of P probes", sync: true, runs: []}
      - {key: a2_trust,     label: "+ trust-ratio step", sync: true, runs: []}
      - {key: a3_pool,      label: "+ fixed pool",       sync: true, runs: []}
      - {key: a4_async,     label: "+ async",                        runs: []}
      - {key: fluxtune,     label: "FluxTune (A6)",                  runs: []}

  - id: phase_b                       # C2: cumulative ladder (headline ablation)
    title: "Cumulative: FwdLLM → FluxTune"
    arms:
      - {key: fwdllm,   label: "FwdLLM",            sync: true, runs: []}
      - {key: b1_e1,    label: "+ mean probes",     sync: true, runs: []}
      - {key: b2_e2,    label: "+ trust ratio",     sync: true, runs: []}
      - {key: b3_e3,    label: "+ fixed pool",      sync: true, runs: []}
      - {key: fluxtune, label: "+ async = FluxTune",            runs: []}

  - id: agg_criteria                  # C3a: when to commit
    title: "Aggregation criterion"
    arms:
      - {key: ac_var,     label: "variance ≤ thr (FwdLLM)", runs: []}
      - {key: ac_cap,     label: "hard stop @ I iters",     runs: []}
      - {key: ac_snr,     label: "SNR target (n_target)",   runs: []}
      - {key: fluxtune,   label: "fixed pool N=50",         runs: []}

  - id: update_utility                # C3b: how probes/uploads are combined
    title: "Update combination"
    arms:
      - {key: uu_align,   label: "grad-aligned (FwdLLM)", runs: []}
      - {key: uu_cos,     label: "cos-sim weighted",      runs: []}
      - {key: uu_top1,    label: "top-1 probe",           runs: []}
      - {key: uu_random,  label: "1 random probe",        runs: []}
      - {key: fluxtune,   label: "mean of P probes",      runs: []}

  - id: step_size                     # C3c: server step and its schedule
    title: "Server step size"
    figures: [group, step_size]       # step_size needs server_update_audit: true
    arms:
      - {key: ss_sgd,     label: "SGD, tuned η",        runs: []}
      - {key: ss_const,   label: "trust ratio, const ρ", runs: []}
      - {key: ss_rm,      label: "trust ratio, ρ0·t^−a", runs: []}
      - {key: fluxtune,   label: "trust ratio, ρ0/Φ",    runs: []}
