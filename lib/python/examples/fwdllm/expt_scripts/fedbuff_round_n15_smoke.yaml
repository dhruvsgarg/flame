# Reduced-scale repro for the round-cadence TIMING_OVERRUN investigation
# (simulate_fwdllm.md SS-B). fedbuff_round/felix_round show real GPU-compute
# overruns at n=100; felix_it/fwdllm/fluxtune never do. Operator hypothesis:
# not compute contention -- the round-cache dispatch/receipt path instead.
# Shrinks scale (100->15, c=30->10, agg_goal=10->5, 1800s->360s, ~2
# trainers/GPU) to cheaply falsify or confirm compute contention.
#
# Real sibling of fedbuff_round_n15_smoke_sim.yaml -- identical except
# time_mode: real, job id, and sim-only knobs.
#
# Uses the `fedbuff_round` baseline: FedBuff(P), the published-anchor async
# floor (uniform random async selection via FedBuffSelector, plain
# staleness-only rate, unaware trainer availability, round-level --
# reselect_each_iteration=false pins the cohort for the span of a round).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fedbuff_round_n15_smoke.yaml

experiments:
  - name: fedbuff_round_n15_smoke
    description: "FedFwd smoke (15 trainers, c=10/agg_goal=5, fedbuff_round baseline: async FedBuffSelector+fedbuff uniform rate, unaware, round-level). Reduced-scale TIMING_OVERRUN repro."

    baseline: fedbuff_round

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 15
      start_id: 1
      dataset:
        name: agnews
        # Cosmetic-only for path-style (naming/snapshot), but kept in sync
        # with the actual partition_method below (EXPTS_CHARTER A5: alpha=1).
        dirichlet_alpha: 1
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
      availability:
        mode: syn_0
      # FedFwd has no simulated-clock support; always real.
      time_mode: real
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- unchanged: reuses the same
      # 100-partition dataset, just the first 15 (0-14) of it. No new
      # partition file needed.
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          # Selector RNG seed — inert on the trainer (self-selects); logged for
          # cross-role consistency with the aggregator (§F-18). Not the pert seed.
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # alpha=1 (EXPTS_CHARTER A5, decided value for all experiments).
          partition_method: niid_label_clients=100_alpha=1

    aggregator:
      config_template: configs/aggregator_base.json
      selector: fedbuff
      tracking_mode: default
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: fedbuff_round_n15_smoke
        hyperparameters:
          seed: 1234  # deterministic selector RNG + model init; MUST match fedbuff_round_n15_smoke_sim.yaml
          rounds: 50  # short smoke run, not the full 300
          # With c=10 > agg_goal=5, commit-then-carry the surplus grads +
          # hold busy trainers across the boundary (K-D12) -- generic async
          # substrate mechanic, not fluxtune-specific.
          inflight_residence: true
          # §H fix: collect grads via streamer-free drain_ready, not recv_fifo
          # (whose lingering per-end tasks stall a cohort ~30s). Code-default
          # OFF; ON here for the validation leg. Must match sim yaml.
          real_drain_ready_ingest: true
          # §H A/B: real-only 0.1s post-distribute settle sleep sim skips +
          # doesn't charge. 0.0 tests whether removing it closes the gap
          # (code-default 0.1). Generic async transport knob, not fluxtune-
          # specific -- kept identical to fluxtune's validated setting.
          real_distribute_settle_s: 0.0
          send_timeout_wait_s: 300
          max_data_id_progress: 9999  # effectively unbounded; runs governed by max_runtime_s
          max_runtime_s: 360  # ...or after 6 minutes wall time
          # Arms runner.py's watchdog (force-kill if the aggregator hangs);
          # inert for fwdllm's own self-stop above (max_runtime_s).
          max_experiment_runtime_s: 600
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: niid_label_clients=100_alpha=1
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 15

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
