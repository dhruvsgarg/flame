# A/B for sim_sct_ordered_drain: leg 1 = drain_ready (true), leg 2 = legacy
# recv_fifo (false, felix's default). Both legs: 10 trainers, 600s cap.
# Compare: sim_rate, buf_depth/recv_wrapper wall, pastdated_n/gap_max in
# [SIM_GRAD_RECV], any [SIM_GRAD_STUCK_EVICT]. Sim-only -- pair against a
# fresh real run (same config) for an actual real<->sim parity read.
#
# Run (both legs, sequentially):
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fluxtune_n10_smoke_sim_no_sct_drain.yaml

experiments:
  - name: fluxtune_n10_smoke_sim_sct_drain_true
    description: "fluxtune SIM, sim_sct_ordered_drain=true (drain A/B leg 1/2), 10 trainers."

    baseline: fluxtune

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        path_style: true
      availability:
        mode: syn_0
      time_mode: simulated
      enable_training_delays: true
      # training_delay_factor must live under trainer.hyperparameters, not
      # trainer.config_overrides.hyperparameters (runner.py fans the former
      # to the aggregator; the latter is silently dropped).
      hyperparameters:
        training_delay_factor: 0.5
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          jvp_perf_opt: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
          sim_straggler_spread_s: 0.0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 3
      log_to_wandb: false
      config_overrides:
        job:
          id: fluxtune_n10_smoke_sim_sct_drain_true
        hyperparameters:
          rounds: 50
          inflight_residence: true
          send_timeout_wait_s: 300
          sim_sct_ordered_drain: true  # leg 1: drain_ready ON
          sim_staggered_redispatch: false
          sim_compute_truthful_gate: true
          sim_gate_compute_cap_s: 16.0  # derived, not guessed: fluxtune real compute p99=6.2s max=10.6s (07-15 banked run) x 1.5 safety -- FWDLLM_DESIGN.md §O
          stalenessPolicy: fedbuff
          max_data_id_progress: 9999
          max_runtime_s: 600
          sim_model_agg_compute_time: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false

  - name: fluxtune_n10_smoke_sim_no_sct_drain
    description: "fluxtune SIM, sim_sct_ordered_drain=false (drain A/B leg 2/2), 10 trainers."

    baseline: fluxtune

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        path_style: true
      availability:
        mode: syn_0
      time_mode: simulated
      enable_training_delays: true
      # training_delay_factor must live under trainer.hyperparameters, not
      # trainer.config_overrides.hyperparameters (runner.py fans the former
      # to the aggregator; the latter is silently dropped).
      hyperparameters:
        training_delay_factor: 0.5
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          jvp_perf_opt: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
          sim_straggler_spread_s: 0.0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 3
      log_to_wandb: false
      config_overrides:
        job:
          id: fluxtune_n10_smoke_sim_no_sct_drain
        hyperparameters:
          rounds: 50
          inflight_residence: true
          send_timeout_wait_s: 300
          sim_sct_ordered_drain: false  # leg 2: legacy recv_fifo (felix's default)
          sim_staggered_redispatch: false
          sim_compute_truthful_gate: true
          sim_gate_compute_cap_s: 16.0  # derived, not guessed: fluxtune real compute p99=6.2s max=10.6s (07-15 banked run) x 1.5 safety -- FWDLLM_DESIGN.md §O
          stalenessPolicy: fedbuff
          max_data_id_progress: 9999
          max_runtime_s: 600
          sim_model_agg_compute_time: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
