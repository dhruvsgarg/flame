# SIM sibling of fwdllm_plus_n10_smoke_short.yaml -- IDENTICAL except
# time_mode: simulated and the job id.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_plus_n10_smoke_sim_short.yaml

experiments:
  - name: fwdllm_plus_n10_smoke_sim_short
    description: "FedFwd SIM SHORT smoke (10 trainers, fwdllm_plus baseline: sync random+fedavg+ORACULAR, time_mode=simulated, 8min budget)."

    baseline: fwdllm_plus

    example:
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        name: agnews
        path_style: true
      availability:
        mode: syn_0
      time_mode: simulated
      enable_training_delays: false
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
          sim_straggler_spread_s: 0.0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_plus_n10_smoke_sim_short
        hyperparameters:
          rounds: 50
          inflight_residence: true
          max_data_id_progress: 9999
          max_runtime_s: 480  # 8min (SHORT variant)
          sim_model_agg_compute_time: true
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            c: 10
            minInitialTrainers: 10

    execution:
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
