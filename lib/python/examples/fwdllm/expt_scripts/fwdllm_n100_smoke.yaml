# FedFwd smoke test: 100 trainers, agnews H5 partitions (client_idx 0-99, the
# full 100-partition niid_label_clients=100_alpha=1 population), real time_mode
# (FedFwd has no simulated-clock support yet).
#
# Uses the `fwdllm` baseline (sync, random selector, fedavg, unaware
# availability, per-round reselection) -- cheapest baseline, and it
# exercises the sync path. c=10 of the 100-trainer pool selected/round
# (agg_goal==c==10, no longer a full-population cohort at this scale).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fwdllm/expt_scripts/fwdllm_n100_smoke.yaml

experiments:
  - name: fwdllm_n100_smoke
    description: "FedFwd smoke (100 trainers, c=10, fwdllm baseline: sync random+fedavg). Validates the launcher port before a full-scale run."

    baseline: fwdllm

    example:
      # fwdllm's trainer entrypoint has no pytorch/ subdirectory, unlike the
      # ExampleConfig default (trainer/pytorch/main.py).
      trainer_main: trainer/main.py

    trainer:
      num_trainers: 100
      start_id: 1
      dataset:
        name: agnews
        # H5 path-style dataset -- no _metadata/dataset_splits/ index-list
        # file exists (or ever will) for agnews; skips that lookup entirely.
        path_style: true
      availability:
        mode: syn_0
      # FedFwd has no simulated-clock support; always real.
      time_mode: real
      # Skip the registry's 4-18s artificial delay for a fast smoke run.
      enable_training_delays: false
      # client_idx = (trainer_id - 1) % 100 -- 1:1 onto all 100 H5 partitions
      # (also the full §O trainer_registry.yaml speed-class population).
      client_idx_modulo: 100
      config_overrides:
        hyperparameters:
          # Selector RNG seed — inert on the trainer (self-selects); logged for
          # cross-role consistency with the aggregator (§F-18). Not the pert seed.
          seed: 1234
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          # Uniform/IID partition for smoke tests -- the niid_label baseline
          # default adds a data-skew confound we don't want while validating
          # the launcher mechanics.
          partition_method: uniform
          client_notify:
            trace: syn_0

    aggregator:
      config_template: configs/aggregator_base.json
      selector: random
      tracking_mode: default
      # Matches selector.kwargs.c below -- every selected trainer is required.
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job:
          id: fwdllm_n100_smoke
        hyperparameters:
          seed: 1234  # deterministic selector RNG + model init (same seed both A/B legs, see fwdllm_n10_smoke_momentum.yaml)
          rounds: 50  # short smoke run, not the full 300
          # Hold a returned trainer's re-pick guard to commit, not RETURN
          # (§R, 2026-07-11). No-op here (agg_goal == c, full-cohort barrier)
          # but keeps the invariant/config identical across all baselines.
          inflight_residence: true
          # Opt-1 (EXPTS_CHARTER §1, validated 0% redundant/-79% down-bytes):
          # downgrades a redundant intra-databin re-send to a still-computing
          # trainer (real-only, num_min_req=1 clamp) to VAR=bad instead of a
          # full weights re-fetch. Already true in baselines.yaml canonical
          # config; was missing here (simulate_fwdllm.md P1, 2026-07-19).
          suppress_redundant_weights: true
          # Smoke-test stop bar: whichever of these fires first ends the run
          # (`rounds` alone is much too coarse, since one round is 150
          # data-id completions).
          max_data_id_progress: 9999  # effectively unbounded; runs governed by max_runtime_s (pass --max-data-id for a short run)
          max_runtime_s: 1800  # ...or after 30 minutes wall time
          data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
          partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
          partition_method: uniform
        selector:
          kwargs:
            # RandomSelector has no `k` concept (matches oort/async_oort/fedbuff/
            # async_random) -- `_cleanup_recvd_ends` used to cap cleanup at a
            # stale n~150-scale `k=5` batch size, which permanently orphaned
            # trainers from this agg_goal==c==10 selected pool every round
            # and, combined with the §M reselect-gate cache, caused a
            # livelock (simulate_fwdllm.md §A). Fixed: cleanup now drains all.
            # c=10 selected/round. minInitialTrainers=N=100, not c (07-17,
            # simulate_fwdllm.md §G): c<N raced sim's faster cycle cadence
            # vs real's for post-barrier joiners, diverging cohort_sequence.
            c: 10
            minInitialTrainers: 100

    execution:
      # 8, not 1 -- this yaml's own default is 100 trainers now; cramming
      # 100 trainer processes onto 1 GPU OOMs almost immediately (see
      # fluxtune_n10_smoke.yaml's execution.num_gpus comment).
      num_gpus: 8
      sleep_between_spawns: 2.0
      aggregator_warmup_time: 20
      monitoring:
        enabled: false
