experiments:
- name: fluxtune_yelp-p_n100_smoke_syn_0_sim
  description: 'FedFwd SIM smoke (100 trainers, c=30/agg_goal=10, fluxtune baseline:
    async async_oort+fedbuff+JVP+3-tier, time_mode=simulated). Validates the Batch-1
    async grad-loop sim drive.'
  baseline: fluxtune
  example:
    trainer_main: trainer/main.py
  trainer:
    num_trainers: 100
    start_id: 1
    dataset:
      name: yelp-p
      path_style: true
      dirichlet_alpha: 1
    availability:
      mode: syn_0
    time_mode: simulated
    enable_training_delays: true
    client_idx_modulo: 100
    config_overrides:
      hyperparameters:
        jvp_perf_opt: true
        seed: 1234
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yelp-p_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yelp-p_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        jvp_eval_mode: true
        sim_straggler_spread_s: 0.0
        sim_completion_leg_s: 0.12
        dataset: yelp-p
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: roberta-large
        model_name: roberta-large
        peft_method: lora
        train_batch_size: 32
        perturbation_count: 10
        probe_combine: mean
        lora_r: 6
        client_notify:
          trace: syn_0
    hyperparameters:
      training_delay_factor: 0.0169
      training_delay_floor_s: 4.0
  aggregator:
    config_template: configs/aggregator_base.json
    selector: async_oort
    tracking_mode: client_notify
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: fluxtune_yelp-p_n100_smoke_syn_0_sim
      hyperparameters:
        seed: 1234
        rounds: 50
        inflight_residence: true
        send_timeout_wait_s: 3600.0
        sim_sct_ordered_drain: true
        sim_staggered_redispatch: false
        sim_compute_truthful_gate: true
        sim_gate_compute_cap_s: 11.0
        sim_model_dispatch_queue: true
        sim_model_agg_compute_time: true
        sim_charge_profile_path: /home/dgarg39/aish_test/flame/lib/python/examples/fwdllm/sim_charge_profiles/fluxtune_yelp-p.yaml
        stalenessPolicy: fedbuff
        max_data_id_progress: 9999
        max_runtime_s: 1000000000
        eval_every_n_commits: 4
        sim_wall_ceiling_s: 108000.0
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/yelp-p_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/yelp-p_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        dataset: yelp-p
        max_seq_length: 256
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        model_type: roberta-large
        model_name: roberta-large
        peft_method: lora
        server_update_audit: true
        train_batch_size: 32
        perturbation_count: 10
        probe_combine: mean
        commit_gate: fixed
        gate_safety_s: 2.4
        cos_ground_truth_audit: false
        server_momentum: 0.9
        lora_r: 6
        server_step_rule: trust_ratio
        rho_schedule: exp
        t_res: 570.0
        budget_stop_frac: 0.0
        phi_stop: halt
        phi_stop_threshold: 1000000000.0
        b_max_probe_every: 0
        pool_target: 50
        eval_max_samples: 3800
        eval_resample: true
        final_full_eval: true
        max_commits: 100000
        target_stop_acc: 0.82
        target_stop_window: 2
        var_stopping_policy: 'off'
        trackTrainerAvail:
          trace: syn_0
      selector:
        kwargs:
          c: 30
          minInitialTrainers: 90
      optimizer:
        kwargs:
          agg_rate_conf:
            type: uniform
  execution:
    num_gpus: 4
    sleep_between_spawns: 2.0
    aggregator_warmup_time: 20
    monitoring:
      enabled: false
