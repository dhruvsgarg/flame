# PR39c1 (FX-N109 E3, priority, shepherd GPUs 0-3; 4-7 are pbehnam3's): do the Felix mechanisms work, and does runtime K find the edge?
# Felix only, syn_0 sims, 3 seeds; vclock 3 h cifar / 6 h speech
# (FX-D197 tasks are ~3x / ~5.5x longer: about PR39b's update counts). ctl = K10c15 (+ B telemetry), K5 = PR39b's cifar best; uK10 = I9 utility on
# receive; nK10 = I7 norm weight; pK10 = per-sample utility + I9 (Q-DUR); dkc = I5 AIMD K + I9; f2 = I5 + I7 + I8 + I9. Speech: ctl, uK10, dkc, f2.
