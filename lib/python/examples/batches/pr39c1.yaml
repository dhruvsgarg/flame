stages:
  - {id: S, args: "--scale-smoke 21600 --tier F39C --gpu-share 2 --datasets google_speech --phases 'gs_F39C_ctl_r1 gs_F39C_ctl_r2 gs_F39C_ctl_r3 gs_F39C_uK10_r1 gs_F39C_uK10_r2 gs_F39C_uK10_r3 gs_F39C_dkc_r1 gs_F39C_dkc_r2 gs_F39C_dkc_r3 gs_F39C_f2_r1 gs_F39C_f2_r2 gs_F39C_f2_r3'", nodes: [shepherd]}
