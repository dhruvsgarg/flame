# F42 S0 + S1 (operator 10-21, 5 h budget): 4 h vclock, seed 1. Felix old (ctl) vs new (l5, l5p) vs FedBuff (check-in) and the
# `*` oracles (REFL*, FedDance*, FedBuff*); s50u adds Felix by check-in (fck, K1). Sync baselines by check-in (REFL, FedDance,
# FedAvg) are left out until their GPU wake bug is fixed (FELIX F42-T10); they run as an add-on batch. Cut for time: e0, l3b, l4, e0p.
name: f42s01
common: "--lease-from-telemetry --gpu-cpus-per-trainer 0.1 --scale-smoke 14400 --gate"
stages:
  - {id: S0C, args: "--tier F42 --datasets cifar10 --baselines felix,fedbuff --phases 'F42_s0u_ctl F42_s0u_l5 F42_s0u_l5p'"}
  - {id: S0Co, args: "--tier F42 --datasets cifar10 --baselines refl,feddance --phases 'F42_s0u_rstar F42_s0u_fdstar'"}
  - {id: S0S, args: "--tier F42 --gpu-share 2 --datasets google_speech --baselines felix,fedbuff --phases 'gs_F42_s0u_ctl gs_F42_s0u_l5 gs_F42_s0u_l5p'"}
  - {id: S0So, args: "--tier F42 --gpu-share 2 --datasets google_speech --baselines refl --phases 'gs_F42_s0u_rstar'"}
  - {id: S1C, args: "--tier F42 --datasets cifar10 --baselines felix,fedbuff --phases 'F42_s50u_ctl F42_s50u_l5 F42_s50u_l5p F42_s50u_fbstar F42_s50u_fck'"}
  - {id: S1Co, args: "--tier F42 --datasets cifar10 --baselines refl,feddance --phases 'F42_s50u_rstar F42_s50u_fdstar'"}
  - {id: S1S, args: "--tier F42 --gpu-share 2 --datasets google_speech --baselines felix,fedbuff --phases 'gs_F42_s50u_ctl gs_F42_s50u_l5 gs_F42_s50u_l5p gs_F42_s50u_fbstar gs_F42_s50u_fck'"}
  - {id: S1So, args: "--tier F42 --gpu-share 2 --datasets google_speech --baselines refl --phases 'gs_F42_s50u_rstar'"}
