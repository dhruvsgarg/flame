# REFL Full Scale Experiment (300 trainers) - Synthetic 100% Availability
# Full-scale REFL with synthetic availability (no unavailability)

experiments:
  - name: refl_n300_syn0
    description: "Full REFL with 300 trainers, syn_0 availability (always available)"
    
    trainer:
      num_trainers: 300
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: syn_0  # Synthetic unavailability of 0% (always available)
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_n300_syn0.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 30  # Select 30 out of 300
      log_to_wandb: true
      wandb_run_name: refl_n300_syn0
    
    execution:
      num_gpus: 8
      sleep_between_spawns: 6.0
      aggregator_warmup_time: 120
