# REFL Full Scale Experiment (300 trainers)
# Full-scale REFL with realistic availability traces

experiments:
  - name: refl_n300_mobiperf2st
    description: "Full REFL with 300 trainers, MobiPerf 2-state traces"
    
    trainer:
      num_trainers: 300
      start_id: 1
      dataset:
        name: cifar10
        dirichlet_alpha: 0.1
      availability:
        mode: mobiperf_2st  # Realistic availability traces
      speedup_factor: 1.0
    
    aggregator:
      config_template: expt_scripts_2026/configs/refl_config_n300.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 30  # Select 30 out of 300
      log_to_wandb: true
      wandb_run_name: refl_n300_mobiperf2st
    
    execution:
      num_gpus: 8
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 10
