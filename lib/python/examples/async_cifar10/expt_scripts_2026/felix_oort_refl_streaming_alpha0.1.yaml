# Opportunity-gap experiment: Felix vs OORT vs REFL under streaming data.
#
# Hypothesis: under streaming, each client's local dataset grows over sim-time,
# so its TRUE statistical utility drifts away from the STALE utility OORT/REFL
# rank by -> they mis-select. Felix refreshes utility via its eval-selector and
# tracks the truth, so it reaches the target accuracy faster and at lower
# communication cost. The no-streaming control arms isolate the effect of
# streaming on mis-selection.
#
# 6 arms = {felix, oort, refl} x {streaming, no-streaming control}.
# Setup: 300 trainers, alpha=0.1 (heterogeneous), syn_0 (100% available),
#        agg_goal=10, 8 GPUs, target accuracy = 60% (computed offline).
#
# After the runs finish, build ground-truth + comparison plots:
#   for d in <run dirs>; do
#     python scripts/analysis/oracle_misselection.py --run-dir "$d"; done
#   python scripts/analysis/analyze_run.py --compare-streaming \
#     <run1>/telemetry ... --labels felix_stream oort_stream refl_stream \
#       felix_ctrl oort_ctrl refl_ctrl --target 0.6 --out compare_plots
#
# Run:
#   python -m flame.launch.run_experiment \
#     lib/python/examples/async_cifar10/expt_scripts_2026/felix_oort_refl_streaming_alpha0.1.yaml
#
# Streaming horizon `full_data_available_after_s` = 10800 sim-seconds (3 sim-h).
# This is calibrated to the run's sim-time scale (~14 s sim-time/round): data
# finishes unlocking around round ~770, so it is *still arriving* through most of
# training to the 60% target -- a strong but FEASIBLE mis-selection signal. (A 24h
# horizon was tried and starves the model: <16% data unlocked by round 1000, so
# 60% would need ~6000+ rounds.) Pass the same value to the oracle via
# --full-after-s if a run's util_disparity events don't span the partial range.

experiments:

  # ---------------- FELIX ----------------
  - name: felix_n300_alpha0.1_syn0_stream
    description: "Felix (async_oort + fedbuff) WITH data streaming."
    baseline: felix
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters: {batchSize: 10, learningRate: 0.01}
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "True", full_data_available_after_s: 10800}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: felix_n300_alpha0.1_syn0_stream}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          evalEveryNRounds: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
        selector: {kwargs: {c: 10, aggGoal: 10}}
    execution: &exec
      num_gpus: 8
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 60
      monitoring:
        enabled: true
        check_interval_seconds: 30
        ram_warning_percent: 80.0
        ram_critical_percent: 90.0
        gpu_warning_percent: 80.0
        gpu_critical_percent: 90.0

  - name: felix_n300_alpha0.1_syn0_ctrl
    description: "Felix control: NO data streaming (full data from start)."
    baseline: felix
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters: {batchSize: 10, learningRate: 0.01}
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "False", full_data_available_after_s: 0}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: async_oort
      tracking_mode: client_notify
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: felix_n300_alpha0.1_syn0_ctrl}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          evalEveryNRounds: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
        selector: {kwargs: {c: 10, aggGoal: 10}}
    execution: *exec

  # ---------------- OORT ----------------
  - name: oort_n300_alpha0.1_syn0_stream
    description: "OORT (sync oort + fedavg, oracular) WITH data streaming."
    baseline: oort
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "True", full_data_available_after_s: 10800}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: oort_n300_alpha0.1_syn0_stream}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
          trackTrainerAvail: {trace: syn_0}
        selector: {kwargs: {aggr_num: 10}}
    execution: *exec

  - name: oort_n300_alpha0.1_syn0_ctrl
    description: "OORT control: NO data streaming."
    baseline: oort
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "False", full_data_available_after_s: 0}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: oort_n300_alpha0.1_syn0_ctrl}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
          trackTrainerAvail: {trace: syn_0}
        selector: {kwargs: {aggr_num: 10}}
    execution: *exec

  # ---------------- REFL ----------------
  - name: refl_n300_alpha0.1_syn0_stream
    description: "REFL (refl_oort + refl, oracular) WITH data streaming."
    baseline: refl
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "True", full_data_available_after_s: 10800}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: refl_n300_alpha0.1_syn0_stream}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
          trackTrainerAvail: {trace: syn_0}
    execution: *exec

  - name: refl_n300_alpha0.1_syn0_ctrl
    description: "REFL control: NO data streaming."
    baseline: refl
    trainer:
      num_trainers: 300
      start_id: 1
      dataset: {name: cifar10, dirichlet_alpha: 0.1}
      availability: {mode: syn_0}
      enable_training_delays: true
      time_mode: simulated
      hyperparameters:
        batchSize: 10
        learningRate: 0.01
        lrDecayEnabled: true
        lrDecayFactor: 0.98
        lrDecayEpoch: 10
        minLearningRate: 0.0001
      config_overrides:
        hyperparameters:
          data_streaming: {enabled: "False", full_data_available_after_s: 0}
          util_counterfactual: {enabled: "True", every_n_rounds: 10, sample_size: 256}
    aggregator:
      config_template: ../_metadata/aggregator_base.json
      selector: refl_oort
      tracking_mode: oracular
      agg_goal: 10
      log_to_wandb: false
      config_overrides:
        job: {id: refl_n300_alpha0.1_syn0_ctrl}
        hyperparameters:
          batchSize: 10
          learningRate: 0.01
          rounds: 1000
          aggGoal: 10
          checkpoint: {enabled: "True", every_n_rounds: 10}
          trackTrainerAvail: {trace: syn_0}
    execution: *exec
