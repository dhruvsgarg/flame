# Base trainer configuration template
# Common properties shared across all trainers
# Trainer-specific values will be injected at runtime

backend: mqtt

brokers:
  - host: localhost
    sort: mqtt
  - host: localhost:10104
    sort: p2p

groupAssociation:
  param-channel: default

channels:
  - description: Model update is sent from trainer to aggregator and vice-versa
    groupBy:
      type: tag
      value:
        - default
    name: param-channel
    pair:
      - trainer
      - aggregator
    funcTags:
      aggregator:
        - distribute
        - aggregate
      trainer:
        - fetch
        - upload

dataset: https://storage.googleapis.com/tensorflow/tf-keras-datasets/mnist.npz

dependencies:
  - numpy >= 1.2.0

hyperparameters:
  batchSize: 32
  learningRate: 0.04
  lrDecayEnabled: false  # Disable by default, enable for REFL experiments
  lrDecayFactor: 0.98  # REFL default
  lrDecayEpoch: 10  # Apply decay every N rounds (REFL default)
  minLearningRate: 0.0001  # Minimum LR floor
  rounds: 5
  # trainer_indices_list: injected at runtime from metadata
  epochs: 1
  use_oort_loss_fn: "True"
  training_delay_enabled: "True"
  satellite_coordinates_path: "lib/python/examples/_metadata/leo/geodetic.npz"
  # training_delay_s: injected at runtime from trainer registry
  # avl_events_*: injected at runtime from availability traces
  client_notify:
    enabled: "False"
    trace: syn_0
  wait_until_next_avl: "True"
  # Stream data in over time instead of exposing the full partition at
  # init. Disabled by default; override per experiment under
  # trainer.config_overrides.hyperparameters.data_streaming.
  data_streaming:
    enabled: "False"
    full_data_available_after_s: 0  # sim seconds until 100% data is visible

  # LEO satellite/ground-station RF link budget (FSPL + atmospheric +
  # ionospheric path loss -> throughput-loss gate). Disabled by default so
  # every existing baseline/parity run is unaffected. See
  # docs/leo_link_budget.md for the full model and ref_snr_db derivation.
  # Mirrored on the aggregator side in examples/_metadata/aggregator_base.json
  # -- keep both in sync when tuning.
  ground_station:
    lat_deg: 47.6062   # Seattle, WA -- an arbitrary default Starlink gateway-like site
    lon_deg: -122.3321
    alt_m: 50.0
  link_budget:
    enabled: "False"
    downlink_freq_mhz: 12000.0       # Ku-band downlink center frequency
    channel_bandwidth_hz: 240000000  # SpaceX FCC filing: 8x240 MHz Ku channels
    ref_snr_db: 20.0                 # see docs/leo_link_budget.md
    ref_distance_km: 550.0           # Starlink's nominal shell altitude
    ref_elevation_deg: 40.0
    atmo_zenith_db: 0.2
    tec_tecu: 50.0
    throughput_loss_threshold: 0.5
    min_elevation_deg: 5.0

baseModel:
  name: ""
  version: 1

job:
  id: "622a358619ab59012eabeefb"
  name: cifar-10

registry:
  sort: dummy
  uri: ""

selector:
  sort: fedbuff
  kwargs:
    c: 20
    aggGoal: 1

optimizer:
  sort: fedavg
  kwargs: {}

maxRunTime: 300

realm: default/us
role: trainer
