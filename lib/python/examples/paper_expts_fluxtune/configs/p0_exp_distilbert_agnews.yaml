# P0 `exp` arm (DistilBERT · AG News), generated by run_sequential.sh; run by fwdllm/expt_scripts/nodes/run_node_p0_queue.sh
# (launched 2026-10-18 04:41, run_20261018_044202; aggregator pinned to GPU 3).
# Env test_fwdllm, from fwdllm/expt_scripts/:
#   EXPT_GPU_ALLOW_PEER=1 FLAME_SLOT_GPUS=0,1,2,3 ./run_sequential.sh --only fluxtune --mode sim --yes --clean --force --gpu-ids 0,1,2,3 \
#     --num-trainers 100 --agg-goal 10 --c 30 --dataset agnews --partition-method niid_label_clients=100_alpha=1 \
#     --adapter-reduction-factor 16 --probe-combine mean --perturbation-count 10 --server-step-rule trust_ratio \
#     --gate-safety-s 1.5 --commit-gate fixed --pool-target 90 --rho-schedule exp --t-res 300 --agg-rate-type uniform \
#     --var-stopping-policy off --budget-stop-frac 0 --b-max-probe-every 0 --phi-stop halt --server-update-audit \
#     --no-cos-ground-truth-audit --eval-every-n-commits 4 --max-runtime-s 86400 --sim-wall-ceiling-h 2
# `pool` arm: same command with --rho-schedule pool.
experiments:
- name: fluxtune_agnews_n100_smoke_syn_0_sim
  description: 'FedFwd SIM smoke (100 trainers, c=30/agg_goal=10, fluxtune baseline:
    async async_oort+fedbuff+JVP+3-tier, time_mode=simulated). Validates the Batch-1
    async grad-loop sim drive.'
  baseline: fluxtune
  example:
    trainer_main: trainer/main.py
  trainer:
    num_trainers: 100
    start_id: 1
    dataset:
      name: agnews
      path_style: true
      dirichlet_alpha: 1
    availability:
      mode: syn_0
    time_mode: simulated
    enable_training_delays: true
    client_idx_modulo: 100
    config_overrides:
      hyperparameters:
        jvp_perf_opt: true
        seed: 1234
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        jvp_eval_mode: true
        sim_straggler_spread_s: 0.0
        sim_completion_leg_s: 0.12
        dataset: agnews
        max_seq_length: 192
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        perturbation_count: 10
        probe_combine: mean
        adapter_reduction_factor: 16
        client_notify:
          trace: syn_0
    hyperparameters:
      training_delay_factor: 0.48
      training_delay_floor_s: 4.0
  aggregator:
    config_template: configs/aggregator_base.json
    selector: async_oort
    tracking_mode: client_notify
    agg_goal: 10
    log_to_wandb: false
    config_overrides:
      job:
        id: fluxtune_agnews_n100_smoke_syn_0_sim
      hyperparameters:
        seed: 1234
        rounds: 50
        inflight_residence: true
        send_timeout_wait_s: 300
        sim_sct_ordered_drain: true
        sim_staggered_redispatch: false
        sim_compute_truthful_gate: true
        sim_gate_compute_cap_s: 11.0
        sim_model_dispatch_queue: true
        sim_model_agg_compute_time: true
        sim_charge_profile_path: /home/dgarg39/aish_test/flame/lib/python/examples/fwdllm/sim_charge_profiles/fluxtune.yaml
        stalenessPolicy: fedbuff
        max_data_id_progress: 9999
        max_runtime_s: 86400
        eval_every_n_commits: 4
        sim_wall_ceiling_s: 7200.0
        data_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/data_files/agnews_data.h5
        partition_file_path: /coc/scratch/dgarg/fl_datasets/fwdllm/fednlp_data/partition_files/agnews_partition.h5
        partition_method: niid_label_clients=100_alpha=1
        dataset: agnews
        max_seq_length: 192
        cache_dir: /coc/scratch/dgarg/fl_datasets/fwdllm/cache_dir
        server_update_audit: true
        perturbation_count: 10
        probe_combine: mean
        commit_gate: fixed
        gate_safety_s: 1.5
        cos_ground_truth_audit: false
        adapter_reduction_factor: 16
        server_step_rule: trust_ratio
        rho_schedule: exp
        t_res: 300.0
        budget_stop_frac: 0.0
        phi_stop: halt
        b_max_probe_every: 0
        pool_target: 90
        var_stopping_policy: 'off'
        trackTrainerAvail:
          trace: syn_0
      selector:
        kwargs:
          c: 30
          minInitialTrainers: 100
      optimizer:
        kwargs:
          agg_rate_conf:
            type: uniform
  execution:
    num_gpus: 4
    sleep_between_spawns: 2.0
    aggregator_warmup_time: 20
    monitoring:
      enabled: false
    gpu_ids:
    - 0
    - 1
    - 2
    - 3
