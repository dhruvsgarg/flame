# Dataset profiles (FX-N10). `debug_run.sh --dataset <name>` deep-merges `experiment` into every
# experiment of the parity template (felix_oort_refl_feddance_alpha0.1_parity.yaml, written for
# cifar10), `by_optimizer.<sort>` into baselines whose optimizer is that sort, then `by_baseline.<name>`:
# a baseline's own tuned values on this dataset (paired client/server lr etc.), which win over the defaults.
# Baseline-defining knobs stay in baselines.yaml; only what differs per dataset lives here.
# Data lives outside the repo: <data_root>/<dataset>/ (cifar10/cifar-10-batches-py,
# google_speech/SpeechCommands/speech_commands_v0.02). fl_data.dataset_dir takes $FLAME_DATA_ROOT, then the
# first entry below that has the dataset, else the old in-repo dir (fwdllm shares the root: fl_datasets/fwdllm).
data_roots:
  - /coc/scratch/dgarg/fl_datasets

datasets:
  # by_baseline = each baseline's tuned trainer values on this dataset, over the shared defaults.
  # Shared defaults (all baselines, unless by_baseline overrides): epochs 1 (trainer_base.yaml; every paper uses 1
  # local epoch/step), lr decay OFF (Hyperparameters default; only REFL configures it), the dataset's optimizer
  # (fl_data: cifar10 SGD, google_speech Adam), template batch 10 / lr 0.01 (cifar10), dataset batch 32 / lr 0.000195 (speech).
  # Field sources: [paper] = the baseline's paper; [repo] = its reference code in third_party/; [ours] = our tuned 2024 runs.
  cifar10:   # the template itself; only per-baseline tuned values here
    by_baseline:
      felix:     # [ours] 2024 cifar trainers (git 728097bad config_dir*_6d_3state_oort): lr 0.04, batch 32; server lr 0.3 (fedbuff.py use_oort_lr)
        trainer: {hyperparameters: {learningRate: 0.04, batchSize: 32}}
      oort:      # [paper] Oort OSDI'21 §6: lr 0.04, batch 32 (non-speech); no decay described
        trainer: {hyperparameters: {learningRate: 0.04, batchSize: 32}}
      oort_star: # = oort (Oort-derived)
        trainer: {hyperparameters: {learningRate: 0.04, batchSize: 32}}
      refl:      # [paper] REFL EuroSys'23 Table 1: lr 0.01, batch 10; [repo] decay x0.98 every 10 rounds, floor 5e-5
        trainer: {hyperparameters: {learningRate: 0.01, batchSize: 10, lrDecayEnabled: true, lrDecayFactor: 0.98,
                                    lrDecayEpoch: 10, minLearningRate: 0.00005}}
      feddance:  # [paper] FedDance SoCC'25 Table 1 CIFAR-10: lr 0.1, batch 24, 1 local step; no decay described
        trainer: {hyperparameters: {learningRate: 0.1, batchSize: 24}}
      fedbuff:   # [ours] FX-N15: server lr 40.9 (fedbuff.py) was tuned with client lr 0.000195, no decay (git 30e20a3f6)
        trainer: {hyperparameters: {learningRate: 0.000195}}

  google_speech:
    description: >-
      SpeechCommands v0.02 (35 words, 1 s at 16 kHz), ResNet34-1D on raw waveforms (fl_data.py).
      Reference = the 2024 SoCC runs (expt_runs_speech_n100_14Jul24_felix_*.sh): n=100, alpha=0.1
      split (dataset_splits/google_speech_alpha0.1_n100.yaml), batch 32, trainer Adam, c 30,
      aggGoal 10, fedbuff server lr table 'google-speech'. Carried over from async_cifar10 since:
      launcher, registry delays (identical for trainers 1-100), syn_*/mobiperf_3st traces, streaming,
      selector knobs, join barrier n-10. Trainer lr 0.000195 (2024 non-oort configs): a centralized check on
      10 trainers' data (4 epochs) reached 43% test acc at 0.000195, 35% at 0.001, and stayed at chance at
      the 2024 '_oort' value 0.04. The FL value is confirmed on GPU (FX-N10 sweep: 0.000195 vs 0.001).
    # FX-D46 (operator): D x5 and timeout 450s on GPU legs (speech task ~270x cifar); a harness --delay-factor wins.
    device_time_scale: 5
    experiment:
      trainer:
        num_trainers: 100
        dataset: {name: google_speech, dirichlet_alpha: 0.1}
        hyperparameters: {batchSize: 32, learningRate: 0.000195}
        config_overrides:
          hyperparameters: {dataset_name: google_speech}
      aggregator:
        config_overrides:
          hyperparameters: {dataset_name: google_speech, batchSize: 32, learningRate: 0.000195,
                            min_trainers_to_start: 90}
    by_optimizer:
      fedbuff:
        aggregator:
          config_overrides:
            optimizer: {kwargs: {dataset_name: google-speech}}
    by_baseline:   # felix, fedbuff: dataset default Adam 0.000195 (FX-T27; [ours] 2024 non-oort configs); the SGD papers set their own
      oort:      # [paper] Oort §6: lr 0.04, batch 16 (speech); FedScale SGD
        trainer: {hyperparameters: {trainerOptimizer: sgd, learningRate: 0.04, batchSize: 16}}
      oort_star: # = oort
        trainer: {hyperparameters: {trainerOptimizer: sgd, learningRate: 0.04, batchSize: 16}}
      refl:      # [paper] REFL Table 1 Google Speech: lr 0.005, batch 20 ([repo] conf_exp.yml says 0.05); [repo] decay as cifar10
        trainer: {hyperparameters: {trainerOptimizer: sgd, learningRate: 0.005, batchSize: 20, lrDecayEnabled: true,
                                    lrDecayFactor: 0.98, lrDecayEpoch: 10, minLearningRate: 0.00005}}
      feddance:  # [paper] FedDance Table 1 Google Speech: lr 0.075, batch 32; FedScale SGD
        trainer: {hyperparameters: {trainerOptimizer: sgd, learningRate: 0.075, batchSize: 32}}
