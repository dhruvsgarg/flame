# Dataset profiles (FX-N10). `debug_run.sh --dataset <name>` deep-merges `experiment` into every
# experiment of the parity template (felix_oort_refl_feddance_alpha0.1_parity.yaml, written for
# cifar10), `by_optimizer.<sort>` into baselines whose optimizer is that sort, then baseline_reference.yaml.
# Stack wiring lives in baselines.yaml; source-faithful baseline values in baseline_reference.yaml (FX-N74).
# Data lives outside the repo: <data_root>/<dataset>/ (cifar10/cifar-10-batches-py,
# google_speech/SpeechCommands/speech_commands_v0.02). fl_data.dataset_dir takes $FLAME_DATA_ROOT, then the
# first entry below that has the dataset, else the old in-repo dir (fwdllm shares the root: fl_datasets/fwdllm).
data_roots:
  - /coc/scratch/dgarg/fl_datasets

datasets:
  # A dataset sets only what differs per dataset; every baseline-defining value lives in baseline_reference.yaml.
  cifar10: {}  # the template itself; per-baseline values: baseline_reference.yaml (FX-N74)

  google_speech:
    description: >-
      SpeechCommands v0.02 (35 words, 1 s at 16 kHz), ResNet34-1D on raw waveforms (fl_data.py).
      Reference = the 2024 SoCC runs (expt_runs_speech_n100_14Jul24_felix_*.sh): n=100, alpha=0.1
      split (dataset_splits/google_speech_alpha0.1_n100.yaml), batch 32, trainer Adam, c 30,
      aggGoal 10, fedbuff server lr table 'google-speech'. Carried over from async_cifar10 since:
      launcher, registry delays (identical for trainers 1-100), syn_*/mobiperf_3st traces, streaming,
      selector knobs, join barrier n-10. Trainer Adam lr 0.000195: a centralized check on 10 trainers' data
      (4 epochs) reached 43% test acc at 0.000195, 35% at 0.001, chance at 0.04; server lr per baseline below.
    # FX-D46 (operator): D x5 and timeout 450s on GPU legs (speech task ~270x cifar); a harness --delay-factor wins.
    device_time_scale: 5
    # FX-D58: <= 7 trainers train at once per A40 (25 idle x 0.47 GB + 7 x 3.1 GB = 33 GB); a random c=30 first wave put 9-11 on one.
    gpu_train_slots: 7
    experiment:
      trainer:
        num_trainers: 100
        dataset: {name: google_speech, dirichlet_alpha: 0.1}
        hyperparameters: {batchSize: 32, learningRate: 0.000195}
        config_overrides:
          hyperparameters: {dataset_name: google_speech}
      aggregator:
        config_overrides:
          hyperparameters: {dataset_name: google_speech, batchSize: 32, learningRate: 0.000195,
                            min_trainers_to_start: 90,
                            targetAccuracy: 0.6}  # FX-N10: stop after stableEvalsAboveTarget (20) evals >= 60%
    by_optimizer:
      fedbuff:
        aggregator:
          config_overrides:
            optimizer: {kwargs: {dataset_name: google-speech}}
    # per-baseline values (client/server lr, batch, local work, decay): baseline_reference.yaml (FX-N74)
