# Baseline catalog. Each entry defines the selector / optimizer / tracking +
# trainer-side overrides that uniquely characterize a baseline. Per-experiment
# values (c, aggGoal, batchSize, rounds, ...) belong in the experiment YAML
# and get deep-merged on top of the baseline.
#
# Schema:
#   baselines.<name>.description         (str)
#   baselines.<name>.example             (dict)  launcher paths; aggregator_main fixes the stack
#   baselines.<name>.aggregator          (dict)  fields merged into aggregator JSON
#   baselines.<name>.trainer             (dict)  fields merged into per-trainer config
#
# Reserved keys at experiment level for overrides:
#   experiment.aggregator.config_overrides  (dict)  deep-merged into aggregator JSON last
#   experiment.trainer.config_overrides     (dict)  deep-merged into trainer config last

baselines:

  felix:
    description: >-
      Felix = async_oort selector (evalGoalFactor=1) + fedbuff optimizer
      (use_oort_lr=True, agg_rate_conf.type=new). Uses client_notify (NOT
      oracular tracking).
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        # Overhead OFF the virtual clock so it tracks completions, not a ramp. PARITY §3c.
        simCommitOverheadSeconds: 0.0
        # Post-commit re-dispatch leg, calibrated to real's measured LAG_DECOMP leg.
        # §3m's 0.0 over-overlapped (advance 3.68 vs 4.14, staleness 4.75 vs 2.80); restored
        # to 1.0 per PARITY §4.1. The 2700s run then OVER-shot: sim advance 4.35 vs real 3.93
        # (K3b .106, U2 .096). Advance moved ~3.68->4.35 across gap 0->1.0 (~0.67s/s slope), so
        # real 3.93 implies gap ~0.6. Retuned 1.0 -> 0.6 (do NOT fit to pass K3b; this tracks
        # real's measured leg). §3L slot-hold engages -> completions de-bunch.
        simRedispatchGapSeconds: 0.6
        # 0 = drop the real-only settle-sleep brake -> real compute-bound at ~c. PARITY §3m.
        realDistributeSettleSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        # Pre-commit holding leg (counts toward staleness). Placeholder; retune vs real
        # LAG_DECOMP after the overnight run (expect ~0.1-0.3 once queue_wait drops). PARITY §3.
        simCompletionLegSeconds: 0.6

  oracle:
    description: >-
      Oracle = streaming-misprioritization performance ceiling. Same async stack
      as Felix (oracle selector + fedbuff optimizer), but run with c = num_trainers
      and a large evalGoalFactor so EVERY client is evaluated on the current model
      each round -> its reported utility is fresh (true), and the selector picks the
      true top-K (no temporal/system/exploration terms, no overcommitment). Set
      selector.kwargs.c = num_trainers and evalGoalFactor = num_trainers/aggGoal in
      the experiment YAML.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: oracle
        kwargs:
          evalGoalFactor: 5.0  # >= num_trainers/aggGoal so all clients are eval'd each round; override per experiment
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        simCommitOverheadSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        use_oort_loss_fn: "True"

  refl:
    description: >-
      REFL = refl_oort selector + refl optimizer with oracular availability
      tracking (priority-based selection, staleness-aware aggregation).
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: refl_oort
        kwargs:
          aggr_num: 10  # per-round selection count (OortSelector requires it); override per experiment to match agg_goal
          avail_priority: 1
          blacklist_rounds: 50
          pacer_step: 20
          pacer_delta: 5
          exploration_factor: 0.9
          exploration_decay: 0.98
          exploration_min: 0.2
      optimizer:
        sort: refl
        kwargs:
          deadline: 100
          stale_update: 5
          stale_factor: -4
          stale_beta: 0.35
          scale_coff: 10.0
          target_ratio: 0.8
          initial_deadline: 100.0
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # See felix note (overhead must stay below the sct-progression rate).
        # Jun9: 0.24 over-charged (sim 4031 rounds vs real 7254, residual
        # -0.14/commit) -> 0.10 (PARITY.md).
        # Jun10: after the lazy-deserialize barrier speedup (sim_rate 1.18->2.31x),
        # 0.10 now OVER-charges: advance 1.74 vs real 1.48 (residual -0.26,
        # implied -0.026/commit) -> 0.10 + (-0.26/K=10) = 0.074.
        simCommitOverheadSeconds: 0.074
        # Hold still-computing trainers in their selection slot until vclock>=sct so
        # sim's eligible pool stops carrying the slow tail (A2b 12.41->~6.5). PARITY §4.5.
        simInflightResidence: True
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  feddance:
    description: >-
      FedDance = feddance selector (V_m * I_m * A_m with MAB exploration) +
      FedAvg optimizer on the base syncfl stack (main_fedavg_agg.py), which
      drives the selector's on_update_received / on_round_completed hooks.
      Availability comes from FedDance's own check-in predictor (not oracular).
      aggr_num is the per-round selection count (override per experiment to match
      agg_goal). Needs trainer use_oort_loss_fn=True (I_m) and local-accuracy
      reporting (A_m), both emitted by the async_cifar10 trainer.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: feddance
        kwargs:
          aggr_num: 10
          history_window: 50
          prediction_window: 5
          accuracy_window: 5
          negative_accuracy_handling: relu
          overcommitment: 1.0
          lambda_cold_start: 0.5
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  oort:
    description: Oort selector (sync) + FedAvg optimizer, oracular tracking.
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: oort
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # NOTE: oort is NOT a pool-composition case -- its eligible pool already
        # matches real (sim 12.12 vs real 11.35); the divergence is the selector
        # picking ~average (12.21) vs real picking fast (8.81). That is a
        # selector-scoring/path issue (see PARITY sec 4.5 oort note), so the
        # sct-gated pool exclusion is intentionally left OFF for oort.
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  fedbuff:
    description: FedBuff = fedbuff selector (uniform async) + fedbuff optimizer. Async stack.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs: {}
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: cifar-10
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedavg:
    description: FedAvg = random selector (sync) + fedavg optimizer. Base syncfl stack.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: random
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  # --- fwdllm (FedFwd) baselines ---
  # FedFwd's aggregator (flame.mode.horizontal.syncfl.fwdllm_aggregator.TopAggregator)
  # is a single, FedFwd-specific implementation (gradient-variance-gated commits,
  # JVP/forward-mode, dynamic_kc controller) -- not the generic asyncfl/syncfl/oort
  # hierarchy the baselines above swap between. Both fwdllm baselines therefore
  # point at the same single aggregator entrypoint (aggregator/main_fedfwd_agg.py);
  # there is no per-stack split here.

  fedfwd_async_random_dynkc:
    description: >-
      FedFwd (forward-mode/JVP variance-gated FL) + async_random selector +
      fedbuff optimizer + adaptive dynamic_kc controller. Transcribed
      faithfully from the existing
      fwdllm/expts/run_tc_expts/json_scripts/aggregator.json (the current
      production default for fwdllm) -- ported as-is, not redesigned.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_random
        kwargs:
          c: 15  # concurrency level; override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to match num_trainers
          evalGoalFactor: 0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          k: 5
          is_async: true
          # Maps task names to eligible avl_state values. Classic FL: only
          # AVL_TRAIN. FedFwd: both AVL_TRAIN and AVL_EVAL can train.
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
          # K adapts to track variance against target_iter_per_data_id; C is
          # held fixed (c_min == c_max == c). Override k_min/k_max/c_min/c_max
          # per experiment to scale with num_trainers.
          dynamic_kc:
            enabled: true
            policy: adaptive_k_var_tracking
            policy_kwargs:
              target_iter_per_data_id: 15
              k_step: 2
              window: 6
            k_min: 5
            k_max: 15
            c_min: 15
            c_max: 15
            update_every_n_aggs: 1
            history_window: 20
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          # NOTE: dataset_name is "google-speech" in the legacy aggregator.json
          # this baseline was transcribed from, even though fwdllm runs agnews.
          # Ported as-is per "transcribed faithfully, not redesigned" -- looks
          # like a copy-paste artifact from another example's config, left
          # unfixed here; flag before relying on this kwarg's value.
          dataset_name: google-speech
          agg_rate_conf:
            type: old
            scale: 1.0
            a_exp: 0.2
            b_exp: 0.25
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NONE"
        rejectStaleUpdates: false
        inc_model_version_per_data_id: true
        # Soft-cap fallback. With adaptive_k_var_tracking, aggregations should
        # converge near target without needing the cap, but it remains as a
        # safety net.
        max_iterations_per_data_id: 15
        # FedSGD variance check threshold. Raised from the distilbert default
        # (0.1) for heterogeneous NIID partitions where gradient variance is
        # naturally higher.
        var_threshold: 0.3
    trainer:
      hyperparameters:
        fl_algorithm: FedFwd
        forward_mode: "True"
        var_control: "True"
        perturbation_sampling: "True"
        client_notify:
          enabled: "False"

  fedfwd_oracular:
    description: >-
      FedFwd + async_oort selector + fedbuff optimizer + ORACULAR trainer
      availability tracking. NOTE:
      flame/mode/horizontal/syncfl/fwdllm_aggregator.py:read_trainer_unavailability()
      currently hardcodes a glob over
      fwdllm/expts/run_tc_expts/json_scripts/trainer_*.json to build the
      oracular event dict -- a library-level (not example-level) dependency
      on the legacy JSON directory. This baseline only stays correct while
      json_scripts/ remains on disk; rewriting read_trainer_unavailability()
      to read _metadata/trainer_registry.yaml +
      _metadata/availability_traces/*.yaml (mirroring main_oort_sync_agg.py's
      pattern for async_cifar10) is flagged as a follow-up, not yet done.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          c: 30
          aggGoal: 10
          evalGoalFactor: 0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 50
          k: 10
          is_async: true
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
          dynamic_kc:
            enabled: false
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: agnews
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        var_threshold: 0.3
    trainer:
      hyperparameters:
        fl_algorithm: FedFwd
        forward_mode: "True"
        client_notify:
          enabled: "True"
