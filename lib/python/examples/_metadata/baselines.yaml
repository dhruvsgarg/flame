# Baseline catalog. Each entry defines the selector / optimizer / tracking +
# trainer-side overrides that uniquely characterize a baseline. Per-experiment
# values (c, aggGoal, batchSize, rounds, ...) belong in the experiment YAML
# and get deep-merged on top of the baseline.
#
# Schema:
#   baselines.<name>.description         (str)
#   baselines.<name>.example             (dict)  launcher paths; aggregator_main fixes the stack
#   baselines.<name>.aggregator          (dict)  fields merged into aggregator JSON
#   baselines.<name>.trainer             (dict)  fields merged into per-trainer config
#
# Reserved keys at experiment level for overrides:
#   experiment.aggregator.config_overrides  (dict)  deep-merged into aggregator JSON last
#   experiment.trainer.config_overrides     (dict)  deep-merged into trainer config last

baselines:

  felix:
    description: >-
      Felix = async_oort selector (evalGoalFactor=1) + fedbuff optimizer
      (use_oort_lr=True, agg_rate_conf.type=new). Uses client_notify (NOT
      oracular tracking).
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        # Jun10 (PARITY.md 3c): the per-commit overhead was charged on the VIRTUAL
        # CLOCK (vclock = max(vclock, sct) + overhead). At 0.315 it dominated the
        # clock entirely (diagnostics: vclock 3189s = overhead_cum 3150 + sct_adv_cum
        # 39, i.e. 98.8% overhead) -- it decoupled the clock from trainer completions
        # and made staleness inflate AND drift over rounds (5->10->20s). Set to 0 so
        # the clock TRACKS completions (vclock = max(vclock, sct)); staleness then =
        # the versions elapsed during a trainer's round-trip, as in real. Any residual
        # per-round-advance gap is a completion-spacing/dispatch issue to model in the
        # trainer sct, NOT to fake on the clock. (History: 0.50 -> 0.16 -> 0.315 -> 0.)
        simCommitOverheadSeconds: 0.0
        # Jun12 (PARITY.md S3k): POST-commit re-dispatch gap. The original 1.6s leg
        # (below) put the WHOLE real post-compute cycle BEFORE the commit, so it
        # inflated staleness (sim 3.45 vs real 2.81 - staleness = holding/advance and
        # the leg lengthened the holding). Measured real decomposition: holding
        # (send->commit) = compute 11.71 + queue_wait 0.61 + delivery 0.09 = 11.79s,
        # then a ~1.0-1.15s POST-commit re-dispatch leg (re-selection + model push)
        # that does NOT count toward staleness. Split the 1.6: keep ~0.6 pre-commit
        # (simCompletionLegSeconds below) and move ~1.0 here as a per-trainer cooldown
        # that holds a just-committed end out of selection until vclock >= sct + gap.
        # Total cycle (compute + 0.6 + 1.0 = compute + 1.6) is preserved, so advance/
        # throughput stay matched; staleness drops to ~(compute+0.6)/advance ~= real.
        simRedispatchGapSeconds: 1.0
        # Jun12 (PARITY.md S3 real-decomp): remove the real-only artificial brake. The
        # 0.1s settle sleep before selection fires twice per commit (~0.2s, ~46% of the
        # real ~0.43s/commit budget), inflating queue_wait + the commit->re-dispatch gap
        # so only ~27.6 of c=30 actually compute. 0 makes the aggregator loop compute-
        # bound -> real maintains ~30 computing (advance ~3.97, staleness ~3.0). NB: this
        # raises real staleness 2.81 -> ~3.0 (the post-commit gap that kept L/C<1 is gone)
        # and SIM should then match at c=30 with simRedispatchGapSeconds back to 0 (the
        # S3L slot-hold becomes unnecessary). Validate on the next real+sim pair.
        realDistributeSettleSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        # Jun12 (PARITY.md S3i/S3k): PRE-commit holding leg only. The real send->commit
        # holding beyond compute is just the buffer-residence (real queue_wait ~0.61s)
        # + agg->trainer delivery/return (~0.09s) ~= 0.6s. This is the part that DOES
        # count toward staleness (clock advances to sct; staleness = holding/advance).
        # The remaining ~1.0s of the real post-compute cycle is the POST-commit
        # re-dispatch latency, modeled separately as simRedispatchGapSeconds (aggregator)
        # so it spaces completions WITHOUT inflating staleness. Was 1.6 (whole cycle
        # pre-commit) -> staleness over-charged 3.45 vs real 2.81; split fixes it.
        simCompletionLegSeconds: 0.6

  oracle:
    description: >-
      Oracle = streaming-misprioritization performance ceiling. Same async stack
      as Felix (oracle selector + fedbuff optimizer), but run with c = num_trainers
      and a large evalGoalFactor so EVERY client is evaluated on the current model
      each round -> its reported utility is fresh (true), and the selector picks the
      true top-K (no temporal/system/exploration terms, no overcommitment). Set
      selector.kwargs.c = num_trainers and evalGoalFactor = num_trainers/aggGoal in
      the experiment YAML.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: oracle
        kwargs:
          evalGoalFactor: 5.0  # >= num_trainers/aggGoal so all clients are eval'd each round; override per experiment
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        simCommitOverheadSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        use_oort_loss_fn: "True"

  refl:
    description: >-
      REFL = refl_oort selector + refl optimizer with oracular availability
      tracking (priority-based selection, staleness-aware aggregation).
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: refl_oort
        kwargs:
          aggr_num: 10  # per-round selection count (OortSelector requires it); override per experiment to match agg_goal
          avail_priority: 1
          blacklist_rounds: 50
          pacer_step: 20
          pacer_delta: 5
          exploration_factor: 0.9
          exploration_decay: 0.98
          exploration_min: 0.2
      optimizer:
        sort: refl
        kwargs:
          deadline: 100
          stale_update: 5
          stale_factor: -4
          stale_beta: 0.35
          scale_coff: 10.0
          target_ratio: 0.8
          initial_deadline: 100.0
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # See felix note (overhead must stay below the sct-progression rate).
        # Jun9: 0.24 over-charged (sim 4031 rounds vs real 7254, residual
        # -0.14/commit) -> 0.10 (PARITY.md).
        # Jun10: after the lazy-deserialize barrier speedup (sim_rate 1.18->2.31x),
        # 0.10 now OVER-charges: advance 1.74 vs real 1.48 (residual -0.26,
        # implied -0.026/commit) -> 0.10 + (-0.26/K=10) = 0.074.
        simCommitOverheadSeconds: 0.074
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  feddance:
    description: >-
      FedDance = feddance selector (V_m * I_m * A_m with MAB exploration) +
      FedAvg optimizer on the base syncfl stack (main_fedavg_agg.py), which
      drives the selector's on_update_received / on_round_completed hooks.
      Availability comes from FedDance's own check-in predictor (not oracular).
      aggr_num is the per-round selection count (override per experiment to match
      agg_goal). Needs trainer use_oort_loss_fn=True (I_m) and local-accuracy
      reporting (A_m), both emitted by the async_cifar10 trainer.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: feddance
        kwargs:
          aggr_num: 10
          history_window: 50
          prediction_window: 5
          accuracy_window: 5
          negative_accuracy_handling: relu
          overcommitment: 1.0
          lambda_cold_start: 0.5
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  oort:
    description: Oort selector (sync) + FedAvg optimizer, oracular tracking.
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: oort
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  fedbuff:
    description: FedBuff = fedbuff selector (uniform async) + fedbuff optimizer. Async stack.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs: {}
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: cifar-10
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedavg:
    description: FedAvg = random selector (sync) + fedavg optimizer. Base syncfl stack.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: random
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0
