# Baseline catalog. Each entry defines the selector / optimizer / tracking +
# trainer-side overrides that uniquely characterize a baseline. Per-experiment
# values (c, aggGoal, batchSize, rounds, ...) belong in the experiment YAML
# and get deep-merged on top of the baseline.
#
# Schema:
#   baselines.<name>.description         (str)
#   baselines.<name>.example             (dict)  launcher paths; aggregator_main fixes the stack
#   baselines.<name>.aggregator          (dict)  fields merged into aggregator JSON
#   baselines.<name>.trainer             (dict)  fields merged into per-trainer config
#
# Reserved keys at experiment level for overrides:
#   experiment.aggregator.config_overrides  (dict)  deep-merged into aggregator JSON last
#   experiment.trainer.config_overrides     (dict)  deep-merged into trainer config last

baselines:

  felix:
    description: >-
      Felix = async_oort selector (evalGoalFactor=1) + fedbuff optimizer
      (use_oort_lr=True, agg_rate_conf.type=new). Uses client_notify (NOT
      oracular tracking).
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        # Jun10 (PARITY.md 3c): the per-commit overhead was charged on the VIRTUAL
        # CLOCK (vclock = max(vclock, sct) + overhead). At 0.315 it dominated the
        # clock entirely (diagnostics: vclock 3189s = overhead_cum 3150 + sct_adv_cum
        # 39, i.e. 98.8% overhead) -- it decoupled the clock from trainer completions
        # and made staleness inflate AND drift over rounds (5->10->20s). Set to 0 so
        # the clock TRACKS completions (vclock = max(vclock, sct)); staleness then =
        # the versions elapsed during a trainer's round-trip, as in real. Any residual
        # per-round-advance gap is a completion-spacing/dispatch issue to model in the
        # trainer sct, NOT to fake on the clock. (History: 0.50 -> 0.16 -> 0.315 -> 0.)
        simCommitOverheadSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        # Jun12 (PARITY.md §3i): sim per-trainer cycle was ~2s shorter than real
        # (sim 11.3s vs real 13.3s; compute 11.7s matches both), so advance
        # under-charged 3.68 vs 4.32 (Little: advance = cycle*aggGoal/inflight) and
        # rounds/terminal/commits ran +14%. The gap = real's post-compute cycle leg
        # (buffer-residence queue_wait ~0.6s + re-dispatch/re-selection latency ~1.0s)
        # that the sim sct omitted. Added to the trainer sct (NOT the clock; §3c) as a
        # completion leg = W_cycle(13.3) - compute(11.7) ~= 1.6s. Staleness baseline
        # (= cycle/advance) is invariant; only advance/throughput are corrected.
        simCompletionLegSeconds: 1.6

  oracle:
    description: >-
      Oracle = streaming-misprioritization performance ceiling. Same async stack
      as Felix (oracle selector + fedbuff optimizer), but run with c = num_trainers
      and a large evalGoalFactor so EVERY client is evaluated on the current model
      each round -> its reported utility is fresh (true), and the selector picks the
      true top-K (no temporal/system/exploration terms, no overcommitment). Set
      selector.kwargs.c = num_trainers and evalGoalFactor = num_trainers/aggGoal in
      the experiment YAML.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: oracle
        kwargs:
          evalGoalFactor: 5.0  # >= num_trainers/aggGoal so all clients are eval'd each round; override per experiment
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        simCommitOverheadSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        use_oort_loss_fn: "True"

  refl:
    description: >-
      REFL = refl_oort selector + refl optimizer with oracular availability
      tracking (priority-based selection, staleness-aware aggregation).
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: refl_oort
        kwargs:
          aggr_num: 10  # per-round selection count (OortSelector requires it); override per experiment to match agg_goal
          avail_priority: 1
          blacklist_rounds: 50
          pacer_step: 20
          pacer_delta: 5
          exploration_factor: 0.9
          exploration_decay: 0.98
          exploration_min: 0.2
      optimizer:
        sort: refl
        kwargs:
          deadline: 100
          stale_update: 5
          stale_factor: -4
          stale_beta: 0.35
          scale_coff: 10.0
          target_ratio: 0.8
          initial_deadline: 100.0
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # See felix note (overhead must stay below the sct-progression rate).
        # Jun9: 0.24 over-charged (sim 4031 rounds vs real 7254, residual
        # -0.14/commit) -> 0.10 (PARITY.md).
        # Jun10: after the lazy-deserialize barrier speedup (sim_rate 1.18->2.31x),
        # 0.10 now OVER-charges: advance 1.74 vs real 1.48 (residual -0.26,
        # implied -0.026/commit) -> 0.10 + (-0.26/K=10) = 0.074.
        simCommitOverheadSeconds: 0.074
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  feddance:
    description: >-
      FedDance = feddance selector (V_m * I_m * A_m with MAB exploration) +
      FedAvg optimizer on the base syncfl stack (main_fedavg_agg.py), which
      drives the selector's on_update_received / on_round_completed hooks.
      Availability comes from FedDance's own check-in predictor (not oracular).
      aggr_num is the per-round selection count (override per experiment to match
      agg_goal). Needs trainer use_oort_loss_fn=True (I_m) and local-accuracy
      reporting (A_m), both emitted by the async_cifar10 trainer.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: feddance
        kwargs:
          aggr_num: 10
          history_window: 50
          prediction_window: 5
          accuracy_window: 5
          negative_accuracy_handling: relu
          overcommitment: 1.0
          lambda_cold_start: 0.5
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  oort:
    description: Oort selector (sync) + FedAvg optimizer, oracular tracking.
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: oort
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  fedbuff:
    description: FedBuff = fedbuff selector (uniform async) + fedbuff optimizer. Async stack.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs: {}
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: cifar-10
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedavg:
    description: FedAvg = random selector (sync) + fedavg optimizer. Base syncfl stack.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: random
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0
