# Baseline catalog. Each entry defines the selector / optimizer / tracking +
# trainer-side overrides that uniquely characterize a baseline. Per-experiment
# values (c, aggGoal, batchSize, rounds, ...) belong in the experiment YAML
# and get deep-merged on top of the baseline.
#
# Schema:
#   baselines.<name>.description         (str)
#   baselines.<name>.example             (dict)  launcher paths; aggregator_main fixes the stack
#   baselines.<name>.aggregator          (dict)  fields merged into aggregator JSON
#   baselines.<name>.trainer             (dict)  fields merged into per-trainer config
#
# Reserved keys at experiment level for overrides:
#   experiment.aggregator.config_overrides  (dict)  deep-merged into aggregator JSON last
#   experiment.trainer.config_overrides     (dict)  deep-merged into trainer config last

baselines:

  # === CNN/speech family (async_cifar10, google-speech, etc.) ===
  # Selectors/optimizers below are shared, generic library code -- example
  # specificity lives only in each example's aggregator_main/trainer config,
  # not in these classes.
  felix:
    description: >-
      Felix = async_oort selector (evalGoalFactor=1) + fedbuff optimizer
      (use_oort_lr=True, agg_rate_conf.type=new). Uses client_notify (NOT
      oracular tracking).
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        # Overhead OFF the virtual clock so it tracks completions, not a ramp. PARITY §3c.
        simCommitOverheadSeconds: 0.0
        # Post-commit re-dispatch leg, calibrated to real's measured LAG_DECOMP leg.
        # §3m's 0.0 over-overlapped (advance 3.68 vs 4.14, staleness 4.75 vs 2.80); restored
        # to 1.0 per PARITY §4.1. The 2700s run then OVER-shot: sim advance 4.35 vs real 3.93
        # (K3b .106, U2 .096). Advance moved ~3.68->4.35 across gap 0->1.0 (~0.67s/s slope), so
        # real 3.93 implies gap ~0.6. Retuned 1.0 -> 0.6 (do NOT fit to pass K3b; this tracks
        # real's measured leg). §3L slot-hold engages -> completions de-bunch.
        simRedispatchGapSeconds: 0.6
        # 0 = drop the real-only settle-sleep brake -> real compute-bound at ~c. PARITY §3m.
        realDistributeSettleSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        # Pre-commit holding leg (counts toward staleness). Placeholder; retune vs real
        # LAG_DECOMP after the overnight run (expect ~0.1-0.3 once queue_wait drops). PARITY §3.
        simCompletionLegSeconds: 0.6

  oracle:
    description: >-
      Oracle = streaming-misprioritization performance ceiling. Same async stack
      as Felix (oracle selector + fedbuff optimizer), but run with c = num_trainers
      and a large evalGoalFactor so EVERY client is evaluated on the current model
      each round -> its reported utility is fresh (true), and the selector picks the
      true top-K (no temporal/system/exploration terms, no overcommitment). Set
      selector.kwargs.c = num_trainers and evalGoalFactor = num_trainers/aggGoal in
      the experiment YAML.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: oracle
        kwargs:
          evalGoalFactor: 5.0  # >= num_trainers/aggGoal so all clients are eval'd each round; override per experiment
          selectType: default
          roundNudgeType: last_train
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: cifar-10
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        simCommitOverheadSeconds: 0.0
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
        wait_until_next_avl: "True"
        use_oort_loss_fn: "True"

  refl:
    description: >-
      REFL = refl_oort selector + refl optimizer with oracular availability
      tracking (priority-based selection, staleness-aware aggregation).
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: refl_oort
        kwargs:
          aggr_num: 10  # per-round selection count (OortSelector requires it); override per experiment to match agg_goal
          avail_priority: 1
          blacklist_rounds: 50
          pacer_step: 20
          pacer_delta: 5
          exploration_factor: 0.9
          exploration_decay: 0.98
          exploration_min: 0.2
      optimizer:
        sort: refl
        kwargs:
          deadline: 100
          stale_update: 5
          stale_factor: -4
          stale_beta: 0.35
          scale_coff: 10.0
          target_ratio: 0.8
          initial_deadline: 100.0
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # See felix note (overhead must stay below the sct-progression rate).
        # Jun9: 0.24 over-charged (sim 4031 rounds vs real 7254, residual
        # -0.14/commit) -> 0.10 (PARITY.md).
        # Jun10: after the lazy-deserialize barrier speedup (sim_rate 1.18->2.31x),
        # 0.10 now OVER-charges: advance 1.74 vs real 1.48 (residual -0.26,
        # implied -0.026/commit) -> 0.10 + (-0.26/K=10) = 0.074.
        simCommitOverheadSeconds: 0.074
        # Hold still-computing trainers in their selection slot until vclock>=sct so
        # sim's eligible pool stops carrying the slow tail (A2b 12.41->~6.5). PARITY §4.5.
        inflightResidence: True
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  feddance:
    description: >-
      FedDance = feddance selector (V_m * I_m * A_m with MAB exploration) +
      FedAvg optimizer on the base syncfl stack (main_fedavg_agg.py), which
      drives the selector's on_update_received / on_round_completed hooks.
      Availability comes from FedDance's own check-in predictor (not oracular).
      aggr_num is the per-round selection count (override per experiment to match
      agg_goal). Needs trainer use_oort_loss_fn=True (I_m) and local-accuracy
      reporting (A_m), both emitted by the async_cifar10 trainer.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: feddance
        kwargs:
          aggr_num: 10
          history_window: 50
          prediction_window: 5
          accuracy_window: 5
          negative_accuracy_handling: relu
          overcommitment: 1.0
          lambda_cold_start: 0.5
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  oort:
    description: Oort selector (sync) + FedAvg optimizer, oracular tracking.
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: oort
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
        # NOTE: oort is NOT a pool-composition case -- its eligible pool already
        # matches real (sim 12.12 vs real 11.35); the divergence is the selector
        # picking ~average (12.21) vs real picking fast (8.81). That is a
        # selector-scoring/path issue (see PARITY sec 4.5 oort note), so the
        # sct-gated pool exclusion is intentionally left OFF for oort.
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  oort_star:
    description: >-
      oort_star = oort sync + FedAvg + aware-at-selection (avail_select_filter=True),
      no proactive in-flight eviction (reactive-90s). Differs from oort only in
      avail_select_filter; the experiment config_overrides set avail_select_filter=True
      (oort sets it False there). Uses same oracular tracking path.
    example:
      aggregator_main: aggregator/pytorch/main_oort_sync_agg.py
    aggregator:
      selector:
        sort: oort
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
    trainer:
      hyperparameters:
        use_oort_loss_fn: "True"

  fedbuff:
    description: FedBuff = fedbuff selector (uniform async) + fedbuff optimizer. Async stack.
    example:
      aggregator_main: aggregator/pytorch/main_asyncfl_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs: {}
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: cifar-10
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedavg:
    description: FedAvg = random selector (sync) + fedavg optimizer. Base syncfl stack.
    example:
      aggregator_main: aggregator/pytorch/main_fedavg_agg.py
    aggregator:
      selector:
        sort: random
        kwargs: {}
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  # === LLM forward-mode family (fwdllm: FedFwd text-classification, agnews/DistilBERT) ===
  # FedFwd's aggregator (flame.mode.horizontal.syncfl.fwdllm_aggregator.TopAggregator)
  # is a single, FedFwd-specific implementation (gradient-variance-gated commits,
  # JVP/forward-mode, dynamic_kc controller) -- not the generic asyncfl/syncfl/oort
  # hierarchy the baselines above swap between. All four baselines below
  # therefore point at the same single aggregator entrypoint
  # (aggregator/main_fedfwd_agg.py); there is no per-stack split here. They
  # still share the same selector/optimizer library code as the CNN/speech
  # family above (no forking) -- only this catalog's parameters differ.
  #
  # Taxonomy (BASELINES.md "FluxTune" section is the source of truth for the
  # full 9-baseline naming grammar `base < base+IT < base+IT+O`, `(P)` =
  # ported): fwdllm/fwdllm_it_unaware/fwdllm_it_oracular are sync;
  # fedbuff_round/fedbuff_it_unaware/fedbuff_it_oracular/felix_round/felix_it/
  # fluxtune/fluxtune_dynkc are async. `reselect_each_iteration` (round vs
  # +IT) gates both the sync path (_select_ends_respecting_reselect_gate)
  # and, as of the async round-cache extension, the async path
  # (_select_ends_for_async_respecting_reselect_gate) -- see
  # fwdllm_aggregator.py.

  fwdllm:
    description: >-
      FedFwd's syncfl baseline (owner's "fwdllm" spec): random selector,
      sync (is_async=false) + fedavg optimizer (plain federated averaging)
      + unaware trainer availability (no trackTrainerAvail, no
      client_notify) + random-candidate perturbation (perturbation_sampling
      on, JVP scoring off -- both are trainer_base.yaml defaults, not
      overridden here). Selection is per-round
      (reselect_each_iteration=false): one selection persists across all
      databins/iterations of a round, re-sampled only when the round
      advances. This is the smoke-test baseline (cheapest, exercises the
      sync path).
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: random
        kwargs:
          is_async: false
          k: 5  # override per experiment to scale with num_trainers
          c: 15  # override per experiment to scale with num_trainers
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NONE"
        # rejectStaleUpdates (the older boolean gate) is superseded by
        # stalenessPolicy below for FedFwd baselines -- see
        # Hyperparameters.staleness_policy (flame/config.py). "exact" is the
        # strictest mode, matching fwdllm's strict-sync design. TODO(verify):
        # confirm this doesn't starve progress under the oracular/mobiperf
        # availability traces at full (300+) trainer scale, where round-trip
        # latency variance is much higher than the n=10 smoke default.
        stalenessPolicy: exact
        # Iteration-per-data_id cap left UNBOUNDED (None) for the sync baselines:
        # the variance-plateau force-commit is a fluxtune optimization (charter
        # Opt-2) that did not exist in vanilla FwdLLM, so fwdllm/fwdllm_plus run
        # the original unbounded variance gate (grind until variance passes).
        var_threshold: 0.3
        # Opt-1 comm-redundancy fix (charter §5c) is now unconditional aggregator
        # behavior, not a config knob (simulate_fwdllm.md §G, 07-19) -- fwdllm
        # used to re-send the identical model to the same K trainers every
        # iteration (~90% redundant, ~22 GB) because the return-driven staleness
        # guard never marked actively-training clients current.
        reselect_each_iteration: false
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fwdllm_it_unaware:
    description: >-
      FwdLLM+IT: round->iteration on the sync substrate, isolating L1 alone
      (BASELINES.md naming grammar). Identical random+fedavg sync stack +
      unaware trainer availability as `fwdllm`, but
      reselect_each_iteration=true (fresh selection on every SEND-state
      call) instead of fwdllm's per-round caching. Pairs with
      `fwdllm_it_oracular` (the availability-aware twin) to isolate L1's
      iteration-level control independent of availability tracking.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: random
        kwargs:
          is_async: false
          k: 5  # override per experiment to scale with num_trainers
          c: 15  # override per experiment to scale with num_trainers
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NONE"
        # Looser than fwdllm's "exact" -- reselect_each_iteration=true
        # already re-picks trainers every iteration, same reasoning as
        # fwdllm_it_oracular below.
        stalenessPolicy: round_data_id
        # Unbounded (None) -- the iteration cap is a fluxtune optimization
        # (charter Opt-2), not part of vanilla FwdLLM+IT.
        var_threshold: 0.3
        reselect_each_iteration: true
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fwdllm_it_oracular:
    description: >-
      FwdLLM+IT+O (renamed from `fwdllm_plus`; owner's "fwdllm+" spec): same
      sync random+fedavg stack as fwdllm, but with ORACULAR trainer-availability
      tracking -- read from _metadata/trainer_registry.yaml +
      _metadata/availability_traces/*.yaml (no more json_scripts/
      dependency) -- and per-iteration reselection
      (reselect_each_iteration=true, i.e. today's default selector-call
      behavior: a fresh selection on every iteration) instead of fwdllm's
      per-round caching. Identical to `fwdllm_it_unaware` at `syn_0`
      (oracular tracking is inert under full availability); diverges once
      run under a scarcity trace (Phase 2).
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: random
        kwargs:
          is_async: false
          k: 5  # override per experiment to scale with num_trainers
          c: 15  # override per experiment to scale with num_trainers
      optimizer:
        sort: fedavg
        kwargs: {}
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
          trace: mobiperf_2st
        # rejectStaleUpdates (the older boolean gate) is superseded by
        # stalenessPolicy below -- see Hyperparameters.staleness_policy
        # (flame/config.py). Looser than fwdllm's "exact" since
        # reselect_each_iteration=true below already re-picks trainers every
        # iteration, making per-iteration staleness not meaningful here.
        # TODO(verify): confirm this is still the intended FedFwd+ semantics
        # at full trainer scale; an unbounded version mismatch here is what
        # let the 21:30 smoke-test crash (a model_version-45 update accepted
        # into a model_version-53 cycle) happen in the first place.
        stalenessPolicy: round_data_id
        # Unbounded (None) — the iteration cap is a fluxtune optimization
        # (charter Opt-2), not part of vanilla FwdLLM_Plus; sync baselines run
        # the original unbounded variance gate. See fwdllm block above.
        var_threshold: 0.3
        # Opt-1 comm-redundancy fix (charter §5c) is now unconditional (see
        # fwdllm block above) -- already near-clean here (per-iteration reselect
        # keeps the guard current, ~3.5%), but the fix covers all baselines.
        reselect_each_iteration: true
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  # --- FluxTune estimator versions (fl_fwd_ft_practice.md P2.1) ---
  # `fluxtune_v1` = the original spec (async execution/selection/aggregation
  # contributions only; the forward-gradient ESTIMATOR itself is untouched --
  # coin-flip probe selection, raw in-place SGD, no anneal, sample-variance
  # commit gate). This is the version whose runs peak near the target then
  # oscillate and collapse (EXPTS_CHARTER.md Issue I-1).
  # `fluxtune_v2` = v1 + the validated estimator-layer fixes from
  # fl_fwd_ft_practice.md's P2.1 ship checklist (items 1,2,3,4,5,6,8 --
  # validated 2026-08-09..2026-08-15, see P3/P4 there for every number).
  # `fluxtune` (plain name, below) is an alias for `fluxtune_v2` -- the
  # default going forward. Use `fluxtune_v1` explicitly only for the
  # pre-estimator-fix ablation. A future `fluxtune_v3` follows the same
  # pattern: copy `fluxtune_v2`'s block, layer in the next validated fixes,
  # and re-point the `fluxtune` alias once it's validated.
  fluxtune_v1:
    description: >-
      FluxTune v1 -- the ORIGINAL fluxtune spec (owner's "fluxtune" spec, for LLM
      fine-tuning -- as opposed to felix, which is for the CNN/speech
      family): async_oort selector (selection axis intentionally
      parameterized the same as felix's, per the owner's "should be
      separated out from felix implementation" note -- no fork, just this
      baseline's own kwargs) + fedbuff optimizer with an explicit
      learning_rate instead of fedbuff's cifar-10/google-speech dataset_name
      lookup table + greedy JVP-based
      perturbation (select_perturbation_using_jvp=true) + 3-tier
      client_notify availability (trainer self-reports
      AVL_TRAIN/AVL_EVAL/UN_AVL via a *_3st_* trace; trackTrainerAvail
      stays disabled -- client_notify is the only availability signal here,
      not layered with ORACULAR/HEARTBEAT). Unlike felix (always fixed
      K/C), fluxtune's K/C policy is itself config-driven: dynamic_kc
      defaults to disabled (fixed K=k, C=c, same as felix's mode) but can
      be flipped to adaptive K/C per experiment via
      selector.kwargs.dynamic_kc.enabled + .policy -- DynamicKCController
      is selector-agnostic (it pushes channel_props["dynamic_c"], which
      async_oort.py already reads, falling back to static self.c when
      absent), so no code fork is needed for either mode.
      Preserved verbatim as of 2026-08-15, the day `fluxtune_v2` (below)
      became the new default `fluxtune`: this is the version whose runs peak
      near the 84% target then oscillate and collapse (EXPTS_CHARTER.md Issue
      I-1; fl_fwd_ft_practice.md P4 arms like `112201`/`145729`/`200325` run
      this exact estimator config to the point of collapse). Kept for
      explicit ablation against the estimator-layer fixes in `fluxtune_v2`
      -- launch with `--only fluxtune_v1`.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          c: 15  # override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to scale with num_trainers
          evalGoalFactor: 0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          k: 5
          is_async: true
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
          # Disabled by default -- fluxtune runs fixed K/C (k/c above) just
          # like felix. Flip enabled: true per experiment (via
          # config_overrides) to switch to adaptive K/C; policy/policy_kwargs
          # are pre-populated so enabling it doesn't require specifying the
          # adaptive-tracking shape from scratch. K/C bounds default to the
          # fixed k/c above when not separately overridden.
          dynamic_kc:
            enabled: false
            policy: adaptive_k_var_tracking
            policy_kwargs:
              target_iter_per_data_id: 15
              k_step: 2
              window: 6
            k_min: 5
            k_max: 15
            c_min: 15
            c_max: 15
            update_every_n_aggs: 1
            history_window: 20
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: agnews
          # Explicit rate -- wins over the dataset_name table above, which
          # has no fwdllm/agnews entry. Starting point; retune against
          # fluxtune's live smoke test.
          learning_rate: 0.075
          # Aggregation rate (per-update weight). DEFAULT for fluxtune is now C3
          # `grad_aware` (Opt-3, charter §5c) -- fluxtune's OWN aggregation. `type: new`
          # is the borrowed FeLiX scalar staleness×utility (magnitude only, charter N2)
          # and is NOT a fluxtune contribution; set it only for the FeLiX-baseline
          # ablation arm. grad_aware weights by DIRECTION/reliability, bounded ≤ base so
          # the effective LR never inflates (no LR re-tune):
          #   base: new           # keep staleness×utility as the base (mobiperf async);
          #                       #   `neutral` = 1.0 (pure gradient-aware, no staleness)
          #   align_gate: true    # S2 (primary): down-weight updates whose cos vs the
          #                       #   running aggregate < align_floor -> 0 at cos=-1
          #                       #   (fixes H1: averaging anti-aligned JVP estimates)
          #   align_floor: 0.0    # gate below this cosine (0 = gate only anti-aligned)
          #   inverse_var: false  # S1 (optional stronger C3): *min(1, var_ref/(var_i+eps))
          #   var_ref: 0.3        #   reliability reference (defaults to var_threshold)
          # `grad_aware_gated_total` + `agg_rate_type` emitted on agg_round.
          # ABLATION: to revert this arm to FeLiX aggregation set `type: new`.
          agg_rate_conf:
            type: grad_aware
            base: new
            align_gate: true
            align_floor: 0.0
            inverse_var: false
            var_ref: 0.3
            scale: 0.4        # base=new (staleness×utility) params
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        # rejectStaleUpdates (the older boolean gate) is superseded by
        # stalenessPolicy below for FedFwd baselines -- see
        # Hyperparameters.staleness_policy (flame/config.py). Async by
        # design: fluxtune's fedbuff optimizer intentionally aggregates
        # whatever's in flight, weighting by staleness (agg_rate_conf above)
        # rather than rejecting it. Explicit "none" here so the gate's
        # absence is a documented choice, not a default.
        stalenessPolicy: none
        var_threshold: 0.3
        # --- fluxtune optimizations (charter §5c) ---
        # Opt-1 (suppress byte-identical intra-databin weight re-sends) is now
        # unconditional aggregator behavior (see fwdllm block above), not a
        # config knob -- here it was 71% redundant / ~68 GB before landing.
        # Opt-2 — variance-plateau force-commit (charter §5c/§5e; DEFAULT ON for
        # fluxtune). The plain var<=threshold gate is a FIXED ABSOLUTE bar: as the
        # model converges, gradients shrink but the perturbation-noise floor doesn't,
        # so a bin needs ever-more JVP samples to average down to 0.30 (measured
        # 15->34 iters/bin early->late at α=1) -> 95.7% of aggregation iterations
        # commit nothing. This policy adds TWO commit triggers on top of var<=thr:
        #   * plateau (PRIMARY, helps early): commit once the per-bin variance curve
        #     FLATTENS -- relative var drop over the last `var_plateau_patience` (N)
        #     iters < `var_plateau_rel_delta` (ε) while var is still above threshold.
        #     Scale-invariant, so it commits the DENOISED estimate at whatever iter it
        #     flattens (early bins ~12-17). This is the "more denoising buys nothing" cut.
        #   * cap (LATE-STAGE BACKSTOP): `max_iterations_per_data_id`. Late in training
        #     the plateau onset drifts out (~33 iters) -- the model is already stable so
        #     waiting that long is wasteful; the cap force-commits at 20 first. Sits
        #     ABOVE the early plateau fire (so plateau stays primary) and BELOW the late
        #     grind (so it caps the tail). Whichever trigger fires first wins; the
        #     `commit_reason` field on agg_round telemetry records which (natural/cap/plateau).
        # Learning is compared against the earlier var<=0.3-only fluxtune run (no A/B).
        # TO DISABLE (revert to var<=thr only, byte-identical): var_stopping_policy: off.
        # TO TUNE: lower ε -> plateau fires later/less; raise ε -> earlier/more (ε=0.25
        # fires ~94% at iter ~11). Lower the cap -> more late-stage forcing (and it
        # engages on shorter bins, e.g. the smoke). Re-characterize at the more-IID
        # ablations (α∈{10,100}) where the floor drops and the grind may soften.
        var_stopping_policy: plateau
        var_plateau_patience: 3       # N: look-back window for the flatten test
        var_plateau_rel_delta: 0.15   # ε: commit when rel var-drop over last N < ε
        max_iterations_per_data_id: 20  # late-stage force-commit ceiling
    trainer:
      hyperparameters:
        select_perturbation_using_jvp: true
        client_notify:
          enabled: "True"
          trace: mobiperf_3st_50

  fluxtune_v2: &fluxtune_v2_def
    description: >-
      FluxTune v2 -- `fluxtune_v1` plus the validated forward-gradient-estimator
      fixes from fl_fwd_ft_practice.md's P2.1 ship checklist (items 1,2,3,4,5,6,8;
      validated 2026-08-09..2026-08-15, every number in fl_fwd_ft_practice.md P3/P4).
      Same async_oort selector, fedbuff optimizer + grad_aware C3, and Opt-1/Opt-2
      var-stop as v1 -- only the estimator layer (how the JVP probes become an
      update, and how the server applies/paces it) changes. New here, all
      aggregator-side except the two marked dual:
        - probe_combine=mean (DUAL: trainer + aggregator) -- combine all P probes
          by mean instead of coin-flip top-2 select; ~10x rho/cos gain for zero
          extra compute, bytes or eta/N/p (P3 "combination rule").
        - server_step_rule=trust_ratio -- pool-then-apply the step, bounding
          ||theta_tr|| growth instead of raw in-place SGD (P3 "step rule").
        - rho_schedule=rm, rho_exp=0.25 -- anneal rho toward the setpoint over the
          horizon instead of holding it constant (P3 "anneal").
        - rho_star=0.06 -- the operating point used across the validated
          portfolio; NOT yet the derived landing law
          (rho*=sqrt(2*B_max/T_res), buildplan §5 task 3.2, still unbuilt) --
          revisit once 3.2 lands.
        - commit_gate=n_target, gate_rho_ref=setpoint -- size the commit pool
          from a closed form on rho instead of the raw sample-variance gate (P3
          "commit gate"). Stays on `setpoint`, not `annealed` -- see the
          gate_rho_ref note below.
        - gate_safety_s=1.5 -- an efficiency constant in that closed form, not a
          safety bound (fl_fwd_ft_practice.md P4.2 "G-1b").
        - cos_ground_truth_audit=true, cos_probe_batch_size=1024,
          cos_probe_every=25 -- emit-only ground-truth cos audit on a fixed
          1024-sample reference (B17), strided every 25 commits to bound its real
          -wall cost (B19).
        - adapter_reduction_factor=64 (DUAL: trainer + aggregator) -- a
          memory/compute-only knob, inert at a pinned rho* (P3 "p").
      gate_rho_ref note: G-2 (fl_fwd_ft_practice.md P4.5, landed 2026-08-15)
      confirmed `annealed` beats `setpoint` on progress-per-vclock, but that same
      `annealed` arm died on `[SIM_WALL_CEILING]` getting there -- unsafe as a
      default until 3.3 (the budget-landing anneal + Phi-stop backstop) ships. v2
      stays on `setpoint`; flipping to `annealed` is tracked as P2.1 item 5b, not
      part of this version.
      REQUIRES an environment variable this schema cannot express: `export
      FWDLLM_FD_SCALE_INVARIANT=1` before launch, so the FD probe step h rescales
      with adapter_reduction_factor and h*sqrt(p) stays constant
      (trainer/forward_training/fwdgrad_utils.py reads it from os.environ
      directly, never from config) -- forgetting it silently runs rf=64 at the
      wrong h. See BASELINES.md Remaining work for tracking a config-level fix.
      Validated end-to-end as exactly this config in run `084554`
      (fl_fwd_ft_practice.md P4.5's G-2 `setpoint` leg, matched vclock).
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          c: 15  # override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to scale with num_trainers
          evalGoalFactor: 0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          k: 5
          is_async: true
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
          dynamic_kc:
            enabled: false
            policy: adaptive_k_var_tracking
            policy_kwargs:
              target_iter_per_data_id: 15
              k_step: 2
              window: 6
            k_min: 5
            k_max: 15
            c_min: 15
            c_max: 15
            update_every_n_aggs: 1
            history_window: 20
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: agnews
          learning_rate: 0.075
          agg_rate_conf:
            type: grad_aware
            base: new
            align_gate: true
            align_floor: 0.0
            inverse_var: false
            var_ref: 0.3
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        stalenessPolicy: none
        var_threshold: 0.3
        var_stopping_policy: plateau
        var_plateau_patience: 3
        var_plateau_rel_delta: 0.15
        max_iterations_per_data_id: 20
        # --- estimator layer, new in v2 (fl_fwd_ft_practice.md P2.1) ---
        probe_combine: mean                # item 1, DUAL -- also under trainer: below
        server_step_rule: trust_ratio      # item 2
        rho_schedule: rm                   # item 3
        rho_exp: 0.25                      # item 3
        rho_star: 0.06                     # operating point; see note above re: 3.2
        commit_gate: n_target              # item 4
        gate_rho_ref: setpoint             # item 4 (NOT annealed -- see note above, item 5b)
        gate_safety_s: 1.5                 # item 5
        cos_ground_truth_audit: true       # item 6
        cos_probe_batch_size: 1024         # item 6 (B17 fixed reference)
        cos_probe_every: 25                # item 6 (B19 stride)
        adapter_reduction_factor: 64       # item 8, DUAL -- also under trainer: below
    trainer:
      hyperparameters:
        select_perturbation_using_jvp: true
        client_notify:
          enabled: "True"
          trace: mobiperf_3st_50
        probe_combine: mean                # item 1, dual-read -- must agree w/ aggregator above
        adapter_reduction_factor: 64       # item 8, dual-read -- must agree w/ aggregator above

  # Plain, unversioned name -- the default `fluxtune` everywhere. Byte-identical
  # to `fluxtune_v2` via YAML anchor (`<<: *fluxtune_v2_def`, no re-typed config
  # to drift out of sync); only the description differs so `--only fluxtune`
  # readers land on an explanation instead of the raw knob list. To move the
  # default (e.g. once `fluxtune_v3` validates), re-point the anchor here and
  # leave `fluxtune_v2`'s own block untouched for explicit ablation.
  fluxtune:
    <<: *fluxtune_v2_def
    description: >-
      FluxTune, the default -- currently an alias for `fluxtune_v2` (see the
      comment above this baseline family for the full versioning scheme). Use
      `fluxtune_v1` explicitly for the pre-estimator-fix ablation (the version
      that peaks near target then collapses, EXPTS_CHARTER.md Issue I-1); use
      `fluxtune_v2` explicitly when a config needs to name this exact version
      even after the default moves on to `fluxtune_v3`.

  fedbuff_round:
    description: >-
      FedBuff(P): FedFwd's published-anchor baseline (Nguyen et al. FedBuff,
      ported onto the forward-mode substrate). Async stack, FedBuffSelector
      (uniform random async selection, NOT oort-smart) + fedbuff optimizer
      with a plain staleness-only rate (agg_rate_conf.type=old,
      use_oort_lr=False -- same as the CNN family's own `fedbuff` baseline)
      + unaware trainer availability (no client_notify, no ORACULAR
      tracking). Round-level (reselect_each_iteration=false -- pins the
      selected cohort for the span of a round, only swapping out members
      that depart; see fwdllm_aggregator.py's async round-cache). Isolates
      L0 alone: does simply removing the sync barrier already help, before
      any FluxTune contribution? Headline EVAL.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs:
          c: 15  # override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to scale with num_trainers
          is_async: true
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: agnews
          # No agnews entry in fedbuff's dataset_name rate table -- explicit
          # rate, same placeholder as fluxtune/felix_round.
          # TODO(verify): retune against a smoke run.
          learning_rate: 0.075
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        stalenessPolicy: none
        var_threshold: 0.3
        reselect_each_iteration: false
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedbuff_it_unaware:
    description: >-
      FedBuff(P)+IT -- the direct L2 attribution floor: FluxTune minus
      C1/C2(pending)/C3, with L0 async + L1 iteration-level control both
      held fixed. Same stack as fedbuff_round (uniform random async
      selection, plain staleness-only rate, unaware tracking) but
      reselect_each_iteration=true: re-invoke the selector's full scoring on
      every dispatch instead of pinning the round's cohort. Pairs with
      fedbuff_it_oracular (the availability-aware twin).
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs:
          c: 15
          aggGoal: 5
          is_async: true
          minInitialTrainers: 15
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: agnews
          learning_rate: 0.075  # TODO(verify): see fedbuff_round
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        stalenessPolicy: none
        var_threshold: 0.3
        reselect_each_iteration: true
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  fedbuff_it_oracular:
    description: >-
      FedBuff(P)+IT+O -- fedbuff_it_unaware's availability-aware twin:
      identical stack, but ORACULAR trainer-availability tracking (read from
      _metadata/trainer_registry.yaml + _metadata/availability_traces/*.yaml)
      instead of unaware. L2 floor's aware variant.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: fedbuff
        kwargs:
          c: 15
          aggGoal: 5
          is_async: true
          minInitialTrainers: 15
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "False"
          dataset_name: agnews
          learning_rate: 0.075  # TODO(verify): see fedbuff_round
          agg_rate_conf:
            type: old
      hyperparameters:
        trackTrainerAvail:
          enabled: "True"
          type: ORACULAR
          # TODO(verify): 2-tier trace ported from fwdllm_it_oracular --
          # unconfirmed whether the async eval-dispatch path needs a 3-tier
          # trace instead. Check on the first smoke run (BRIDGE_DESIGN.md
          # §2b instrumentation-readiness pattern).
          trace: mobiperf_2st
        stalenessPolicy: none
        var_threshold: 0.3
        reselect_each_iteration: true
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
          trace: syn_0

  felix_round:
    description: >-
      Felix(P): FedFwd's other published anchor (this project's own Felix,
      async_oort oort-smart selection, ported onto the forward-mode
      substrate). Same async_oort selection axis as Felix's own CNN-family
      baseline (evalGoalFactor=1.0 -- NOT fluxtune's 0) + fedbuff optimizer
      with the borrowed FeLiX staleness x utility rate
      (agg_rate_conf.type=new, NOT fluxtune's own grad_aware C3) +
      client_notify availability (Felix's own tracking mechanism -- NOT
      oracular, see BASELINES.md Felix section) -- no C1
      (select_perturbation_using_jvp stays off, trainer_base.yaml default)
      and no C3. Round-level (reselect_each_iteration=false). Isolates L1 on
      a smart-selection substrate: does availability-aware smart selection
      alone already close most of the gap before any FluxTune contribution?
      Headline EVAL. `learning_rate: 0.075` ported from fluxtune
      (TODO(verify): retune against a smoke run, BASELINES.md Remaining
      work #5).
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          c: 15  # override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to scale with num_trainers
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          k: 5
          is_async: true
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: agnews
          learning_rate: 0.075  # TODO(verify), see description
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        stalenessPolicy: none
        var_threshold: 0.3
        reselect_each_iteration: false
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
          trace: mobiperf_3st_50

  felix_it:
    description: >-
      Felix(P)+IT -- not Felix's native behavior: grafts FluxTune's own
      iteration-level reselect cadence (reselect_each_iteration=true) onto
      Felix(P)'s selector, done only to isolate L1's contribution and show
      iteration-level control *alone* isn't enough (motivating C1+C3).
      Otherwise identical to felix_round (same selector/optimizer/tracking,
      still no C1/C3). felix_it -> fluxtune isolates exactly C1+C3 (not C2).
      Never headlined -- crediting a published baseline with our own
      mechanism in the EVAL row would be an unearned advantage to that
      baseline.
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_oort
        kwargs:
          c: 15
          aggGoal: 5
          evalGoalFactor: 1.0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15
          k: 5
          is_async: true
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          dataset_name: agnews
          learning_rate: 0.075  # TODO(verify), see felix_round
          agg_rate_conf:
            type: new
            scale: 0.4
            a_exp: 0.25
            b_exp: 0.1
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NA"
        stalenessPolicy: none
        var_threshold: 0.3
        reselect_each_iteration: true
    trainer:
      hyperparameters:
        client_notify:
          enabled: "True"
          trace: mobiperf_3st_50

  fluxtune_dynkc:
    description: >-
      Research variant: async_random + adaptive dynamic_kc controller +
      fedbuff, preserving fedfwd_async_random_dynkc (the prior production
      default, transcribed faithfully from the legacy
      fwdllm/expts/run_tc_expts/json_scripts/aggregator.json) under the new
      naming scheme rather than deleting it outright -- this adaptive
      async+K research config maps to none of fwdllm/fwdllm_plus/fluxtune.
      Selector/optimizer/hyperparameters kept identical to the ported
      production default -- deliberately NOT updated to use fedbuff's new
      explicit learning_rate kwarg or the agnews-correct dataset_name,
      including its known
      dataset_name: google-speech copy-paste artifact -- so it stays a
      valid parity baseline. (Trainer-side forward_mode/var_control/
      perturbation_sampling/fl_algorithm overrides were dropped since they
      only restated trainer_base.yaml's defaults; the resolved values are
      unchanged.)
    example:
      aggregator_main: aggregator/main_fedfwd_agg.py
    aggregator:
      selector:
        sort: async_random
        kwargs:
          c: 15  # concurrency level; override per experiment to scale with num_trainers
          aggGoal: 5  # override per experiment to match num_trainers
          evalGoalFactor: 0
          selectType: default
          roundNudgeType: last_train
          minInitialTrainers: 15  # override per experiment to scale with num_trainers
          k: 5
          is_async: true
          # Maps task names to eligible avl_state values. Classic FL: only
          # AVL_TRAIN. FedFwd: both AVL_TRAIN and AVL_EVAL can train.
          task_eligible_states:
            train: [AVL_TRAIN, AVL_EVAL]
            eval: [AVL_EVAL, AVL_TRAIN]
          # K adapts to track variance against target_iter_per_data_id; C is
          # held fixed (c_min == c_max == c). Override k_min/k_max/c_min/c_max
          # per experiment to scale with num_trainers.
          dynamic_kc:
            enabled: true
            policy: adaptive_k_var_tracking
            policy_kwargs:
              target_iter_per_data_id: 15
              k_step: 2
              window: 6
            k_min: 5
            k_max: 15
            c_min: 15
            c_max: 15
            update_every_n_aggs: 1
            history_window: 20
      optimizer:
        sort: fedbuff
        kwargs:
          use_oort_lr: "True"
          # NOTE: dataset_name is "google-speech" in the legacy aggregator.json
          # this baseline was transcribed from, even though fwdllm runs agnews.
          # Ported as-is per "transcribed faithfully, not redesigned" -- looks
          # like a copy-paste artifact from another example's config, left
          # unfixed here (deliberately, for parity -- see description above).
          dataset_name: google-speech
          agg_rate_conf:
            type: old
            scale: 1.0
            a_exp: 0.2
            b_exp: 0.25
      hyperparameters:
        trackTrainerAvail:
          enabled: "False"
          type: "NONE"
        rejectStaleUpdates: false
        # Soft-cap fallback. With adaptive_k_var_tracking, aggregations should
        # converge near target without needing the cap, but it remains as a
        # safety net.
        max_iterations_per_data_id: 15
        # FedSGD variance check threshold. Raised from the distilbert default
        # (0.1) for heterogeneous NIID partitions where gradient variance is
        # naturally higher.
        var_threshold: 0.3
    trainer:
      hyperparameters:
        client_notify:
          enabled: "False"
