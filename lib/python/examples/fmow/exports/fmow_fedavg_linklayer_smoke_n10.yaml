# FMoW FedAvg smoke test + link layer: 10 trainers, capture-driven data (no dirichlet
# index split -- path_style: true). Aggregator-side RF link budget enabled,
# telemetry only (affectsDelay false), so round timing matches fmow_fedavg_smoke_n10.
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fmow/exports/fmow_fedavg_linklayer_smoke_n10.yaml

experiments:
  - name: fmow_fedavg_linklayer_smoke_n10
    description: "FMoW FedAvg sync smoke (10 trainers, syn_0, capture-driven data) with the link layer enabled on the aggregator."

    baseline: fedavg

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        path_style: true
      availability:
        mode: syn_0
      enable_training_delays: true
      hyperparameters:
        batchSize: 16
        learningRate: 0.0001

    aggregator:
      config_template: metadata/aggregator_base.json
      selector: random
      tracking_mode: default
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: fmow_fedavg_linklayer_smoke_n10
        hyperparameters:
          batchSize: 16
          learningRate: 0.0001
          rounds: 50
          fmow_config_path: "lib/python/examples/fmow/configs/fmow_config.yaml"
          linkLayer:
            enabled: true
            satelliteEcefPath: "lib/python/examples/fmow/metadata/leo/ecef.npz"
        selector:
          kwargs:
            k: 5
            c: 5

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false