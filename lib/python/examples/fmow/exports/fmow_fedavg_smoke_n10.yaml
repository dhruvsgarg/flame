# FMoW FedAvg smoke test: 10 trainers, capture-driven data (no dirichlet
# index split -- path_style: true).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/FMoW/expt_scripts_2026/fmow_fedavg_smoke_n10.yaml

experiments:
  - name: fmow_fedavg_smoke_n10
    description: "FMoW FedAvg sync smoke (10 trainers, syn_0, capture-driven data)."

    baseline: fedavg

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        path_style: true
      availability:
        mode: syn_0
      enable_training_delays: true
      hyperparameters:
        batchSize: 16
        learningRate: 0.0001

    aggregator:
      config_template: metadata/aggregator_base.json
      selector: random
      tracking_mode: default
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: fmow_fedavg_smoke_n10
        hyperparameters:
          batchSize: 16
          learningRate: 0.0001
          rounds: 50
          fmow_config_path: "lib/python/examples/fmow/configs/fmow_config.yaml"
        selector:
          kwargs:
            k: 5
            c: 5

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false