# FMoW FedAvg (sync) in REAL time with the link enforced on the wire: each
# trainer's MQTT goes through its own Toxiproxy proxy, shaped per transfer
# (propagation latency + modeled rate); pass waits are slept by the trainer.
# ISL routing keeps waits ~0 (direct would sleep for hour-scale passes).
#
# Prereqs: toxiproxy-server running (API 127.0.0.1:8474), and a broker that
# accepts >2 MB packets (mosquitto 2.1: max_packet_size 268435455).
#
# Run:
#   python -m flame.launch.run_experiment \
#       lib/python/examples/fmow/exports/fmow_fedavg_linkdelay_toxiproxy_n10.yaml

experiments:
  - name: fmow_fedavg_linkdelay_toxiproxy_n10
    description: "FMoW FedAvg sync smoke (10 trainers) real mode, ISL routing, Toxiproxy-enforced link."

    baseline: fedavg

    trainer:
      num_trainers: 10
      start_id: 1
      dataset:
        path_style: true
      availability:
        mode: syn_0
      enable_training_delays: true
      time_mode: real
      hyperparameters:
        batchSize: 16
        learningRate: 0.0001
        linkLayer:
          enabled: true
          affectsDelay: true
          routing: isl
          enforcement: toxiproxy
          satelliteEcefPath: "lib/python/examples/fmow/metadata/leo/ecef.npz"

    aggregator:
      config_template: metadata/aggregator_base.json
      selector: random
      tracking_mode: default
      agg_goal: 5
      log_to_wandb: false
      config_overrides:
        job:
          id: fmow_fedavg_linkdelay_toxiproxy_n10
        hyperparameters:
          batchSize: 16
          learningRate: 0.0001
          rounds: 50
          fmow_config_path: "lib/python/examples/fmow/configs/fmow_config.yaml"
          linkLayer:
            enabled: true
            satelliteEcefPath: "lib/python/examples/fmow/metadata/leo/ecef.npz"
        selector:
          kwargs:
            k: 5
            c: 5

    execution:
      num_gpus: 2
      sleep_between_spawns: 1.0
      aggregator_warmup_time: 15
      monitoring:
        enabled: false
